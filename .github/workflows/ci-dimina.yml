name: Dimina Web Experiment

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to validate (empty uses the selected ref)
        required: false
        default: ''
        type: string
      diagnostics:
        description: 采集原冷路径的浏览器与 Windows 网络资源证据
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .gitattributes
      - 'packages-private/dimina-playground/**'
      - 'e2e/dimina/**'
      - e2e/vitest.e2e.dimina.config.ts
      - .github/workflows/ci-dimina.yml

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dimina-${{ github.workflow }}-${{ inputs.pr-number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      profile: ci-dimina
  validation:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    uses: ./.github/workflows/validate-ci-dimina.yml
    with:
      pr_context: ${{ needs.pr-context.outputs.pr_context }}
      diagnostics: ${{ inputs.diagnostics || false }}
    secrets: inherit
