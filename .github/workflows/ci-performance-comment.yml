name: CI Performance Comment

on:
  workflow_run:
    workflows: [CI Performance, Wevu Runtime Size]
    types: [completed]

concurrency:
  group: ci-performance-comment-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && !startsWith(github.event.workflow_run.head_branch, 'release/pnpm-version')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted reporting scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve matching benchmark runs
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          WORKFLOW_EVENT_JSON: ${{ toJSON(github.event) }}
        run: node .github/scripts/resolve-performance-runs.mjs

      - name: Download CI Performance artifacts
        if: steps.resolve.outputs.performance_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*performance-report*'
          path: performance-artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.performance_run_id }}

      - name: Download Wevu Runtime Size artifact
        if: steps.resolve.outputs.runtime_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wevu-runtime-size-report
          path: runtime-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.runtime_run_id }}

      - name: Create or update PR performance comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          PERFORMANCE_RUN_ID: ${{ steps.resolve.outputs.performance_run_id }}
          PERFORMANCE_RUN_URL: ${{ steps.resolve.outputs.performance_run_url }}
          PERFORMANCE_CONCLUSION: ${{ steps.resolve.outputs.performance_conclusion }}
          PERFORMANCE_DURATION_MS: ${{ steps.resolve.outputs.performance_duration_ms }}
          RUNTIME_RUN_ID: ${{ steps.resolve.outputs.runtime_run_id }}
          RUNTIME_RUN_URL: ${{ steps.resolve.outputs.runtime_run_url }}
          RUNTIME_CONCLUSION: ${{ steps.resolve.outputs.runtime_conclusion }}
          RUNTIME_DURATION_MS: ${{ steps.resolve.outputs.runtime_duration_ms }}
          PERFORMANCE_ARTIFACT_ROOT: performance-artifacts
          RUNTIME_ARTIFACT_ROOT: runtime-artifacts
        run: node .github/scripts/upsert-performance-comment.mjs
