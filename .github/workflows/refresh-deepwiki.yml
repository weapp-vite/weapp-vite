name: Refresh DeepWiki

on:
  schedule:
    # GitHub cron has no continuous "every 8 days" expression. Run daily and
    # let the public DeepWiki index date enforce the eight-day interval.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-deepwiki
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh weapp-vite DeepWiki
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install browser automation dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: Read current main commit
        run: echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh DeepWiki when due
        run: node .github/scripts/refresh-deepwiki.mjs

      - name: Preserve unsuccessful refresh evidence
        if: failure() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepwiki-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/deepwiki-refresh/
          include-hidden-files: true
          if-no-files-found: warn
