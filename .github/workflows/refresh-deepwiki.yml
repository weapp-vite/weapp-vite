name: Refresh DeepWiki

on:
  schedule:
    # GitHub cron has no continuous "every 8 days" expression. Run daily and
    # let the public DeepWiki index date enforce the eight-day interval.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect the public index and refresh controls without submitting a refresh
        type: boolean
        default: true

concurrency:
  group: refresh-deepwiki
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh weapp-vite DeepWiki
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install browser automation dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: Check the official refresh flow with local browser fixtures
        run: pnpm exec vitest run --config .github/scripts/deepwiki/vitest.config.mjs

      - name: Read current main commit
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          import process from 'node:process'

          const remoteMain = execFileSync('git', ['ls-remote', '--exit-code', 'origin', 'refs/heads/main'], { encoding: 'utf8' }).trim()
          const mainSha = remoteMain.match(/^([0-9a-f]{40})\s+refs\/heads\/main$/i)?.[1]
          if (!mainSha) {
            throw new Error('Unable to read the current main commit from origin')
          }
          appendFileSync(process.env.GITHUB_ENV, `MAIN_SHA=${mainSha}\n`)
          NODE

      - name: Refresh DeepWiki when due
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          DEEPWIKI_REFRESH_EMAIL: ${{ secrets.DEEPWIKI_REFRESH_EMAIL }}
        run: node .github/scripts/refresh-deepwiki.mjs

      - name: Upload DeepWiki diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepwiki-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .tmp/deepwiki-refresh/diagnostics.json
            .tmp/deepwiki-refresh/page.png
          if-no-files-found: ignore
          retention-days: 7
