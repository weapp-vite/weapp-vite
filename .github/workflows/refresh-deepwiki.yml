name: DeepWiki

on:
  schedule:
    # Read the public index daily; refresh is an explicit manual operation.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Monitor the public index or explicitly request a refresh
        type: choice
        required: true
        default: monitor
        options:
          - monitor
          - refresh

concurrency:
  group: refresh-deepwiki
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deepwiki:
    name: DeepWiki index status and explicit refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^22.23.4
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install monitor dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Read current main commit
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          import process from 'node:process'

          const remoteMain = execFileSync('git', ['ls-remote', '--exit-code', 'origin', 'refs/heads/main'], { encoding: 'utf8' }).trim()
          const mainSha = remoteMain.match(/^([0-9a-f]{40})\s+refs\/heads\/main$/i)?.[1]
          if (!mainSha) {
            throw new Error('Unable to read the current main commit from origin')
          }
          appendFileSync(process.env.GITHUB_ENV, `MAIN_SHA=${mainSha}\n`)
          NODE

      - name: Install explicit refresh browser
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'
        run: pnpm exec playwright install --with-deps chromium

      - name: Monitor DeepWiki index
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'monitor'
        run: node .github/scripts/refresh-deepwiki.mjs --mode=monitor

      - name: Explicitly refresh DeepWiki when due
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'
        run: node .github/scripts/refresh-deepwiki.mjs --mode=refresh

      - name: Upload DeepWiki index status
        if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'monitor')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepwiki-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .tmp/deepwiki-monitor/status.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve unsuccessful refresh evidence
        if: failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepwiki-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/deepwiki-refresh/
          include-hidden-files: true
          if-no-files-found: warn
