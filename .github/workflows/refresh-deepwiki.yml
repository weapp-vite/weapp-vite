name: Monitor DeepWiki

on:
  schedule:
    # Read the public index daily; the DeepWiki badge manages refresh requests.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-deepwiki
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    name: Monitor weapp-vite DeepWiki
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install monitor dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Read current main commit
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          import process from 'node:process'

          const remoteMain = execFileSync('git', ['ls-remote', '--exit-code', 'origin', 'refs/heads/main'], { encoding: 'utf8' }).trim()
          const mainSha = remoteMain.match(/^([0-9a-f]{40})\s+refs\/heads\/main$/i)?.[1]
          if (!mainSha) {
            throw new Error('Unable to read the current main commit from origin')
          }
          appendFileSync(process.env.GITHUB_ENV, `MAIN_SHA=${mainSha}\n`)
          NODE

      - name: Monitor DeepWiki index
        run: node .github/scripts/refresh-deepwiki.mjs

      - name: Upload DeepWiki index status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepwiki-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .tmp/deepwiki-monitor/status.json
          if-no-files-found: ignore
          retention-days: 7
