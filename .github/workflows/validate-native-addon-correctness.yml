name: Validate Native Addon Correctness
on:
  workflow_call:
    inputs:
      verification_topology:
        required: false
        type: string
        default: optimized-v1
      pr_context:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    if: inputs.verification_topology != 'optimized-v2'
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      profile: native-addon-correctness

  actual-addon:
    if: ${{ !cancelled() && (inputs.verification_topology == 'optimized-v2' || needs.pr-context.result == 'success') && ((inputs.verification_topology == 'optimized-v2' && ((fromJSON(inputs.pr_context).event == 'pull_request' && fromJSON(inputs.pr_context).selections['native-addon-correctness'] || fromJSON(inputs.pr_context).event != 'pull_request' && fromJSON(inputs.pr_context).shouldRun) && 'true' || 'false') || needs.pr-context.outputs.should_run) == 'true') }}
    needs: pr-context
    name: Actual N-API Addon (${{ matrix.os }} / Node 24.22.1)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      WEAPP_VITE_VERIFICATION_TOPOLOGY: ${{ inputs.verification_topology }}
      NATIVE_CORRECTNESS_EXPECTED_COMMIT: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
      NATIVE_CORRECTNESS_DRIVER_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
          persist-credentials: false

      - name: Validate frozen identity in the executing job
        if: inputs.verification_topology == 'optimized-v2'
        uses: ./.github/actions/verify-frozen-job-context
        with:
          context: ${{ inputs.pr_context }}
          profile: native-addon-correctness
      - name: Check out the trusted correctness driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .tmp/pr-driver
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies without lifecycle builds
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the correctness evidence gate
        run: pnpm exec vitest run --root .tmp/pr-driver --config scripts/vitest.config.mjs scripts/verify-native-addon-correctness.test.mjs scripts/nativeAddonCorrectness --maxWorkers=1 --no-file-parallelism

      - name: Freeze and validate the candidate correctness manifest
        run: node .tmp/pr-driver/scripts/verify-native-addon-correctness.mjs plan .tmp/native-addon-correctness

      - name: Install the package Rust toolchain
        working-directory: packages/ast-native
        run: rustup show active-toolchain

      - name: Build the release addon from the locked Rust dependencies
        run: pnpm --filter @weapp-vite/ast-native exec napi build --esm --platform --release --no-js --dts target/index.d.ts -- --locked

      - name: Require the actual addon and all covered exports
        run: node .tmp/pr-driver/scripts/verify-native-addon-correctness.mjs binding .tmp/native-addon-correctness

      - name: Build fresh manifest closures and run actual N-API suites serially
        run: node .tmp/pr-driver/scripts/verify-native-addon-correctness.mjs run .tmp/native-addon-correctness

      - name: Reject skipped, empty, or incomplete correctness results
        if: ${{ !cancelled() }}
        run: node .tmp/pr-driver/scripts/verify-native-addon-correctness.mjs report .tmp/native-addon-correctness

      - name: Upload only the validated portable evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-addon-correctness-${{ matrix.os }}-${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
          include-hidden-files: true
          path: |
            .tmp/native-addon-correctness/binding.json
            .tmp/native-addon-correctness/summary.json
          if-no-files-found: error
