name: Auto Import Build Diagnostic
run-name: Auto import build diagnostic @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Exact candidate SHA; must match the selected workflow ref
        required: true
        type: string

concurrency:
  group: auto-import-build-diagnostic-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: macOS / seven pairs / 69 manual first and repeat
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate-sha }}
      CANDIDATE_SHA: ${{ github.sha }}
      BASELINE_SHA: e7862e61dd83e3b9e356ac1e176267b31ab298af
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      BASELINE_ROOT: ${{ github.workspace }}/baseline
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact candidate and collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the fixed baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: e7862e61dd83e3b9e356ac1e176267b31ab298af
          persist-credentials: false
      - name: Verify requested immutable identity
        working-directory: candidate
        run: |
          node --input-type=module <<'NODE'
          if (!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_CANDIDATE_SHA ?? '')
            || process.env.EXPECTED_CANDIDATE_SHA !== process.env.CANDIDATE_SHA
            || process.env.BASELINE_SHA !== 'e7862e61dd83e3b9e356ac1e176267b31ab298af'
            || process.env.GITHUB_RUN_ATTEMPT !== '1') {
            throw new Error('Dispatch requires the exact candidate, original baseline and first attempt')
          }
          NODE
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            candidate/pnpm-lock.yaml
            baseline/pnpm-lock.yaml
      - name: Install candidate dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Install baseline dependencies
        working-directory: baseline
        run: pnpm install --frozen-lockfile
      - name: Build each checkout's own package dependencies
        run: |
          pnpm --dir baseline --filter 'weapp-vite...' -r run build
          pnpm --dir candidate --filter 'weapp-vite...' -r run build
      - name: Collect paired opt-in diagnostics
        working-directory: candidate
        env:
          REPORT_ROOT: ${{ runner.temp }}/auto-import-build-diagnostic
        run: node --import tsx scripts/autoImportBuildDiagnostic/runner.ts
      - name: Record diagnostic boundary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            'Fixed baseline and exact candidate: seven serial pairs on this macOS runner with alternating order.',
            'Each pair preserves 69 manual components, first build and a second new CLI process against the same fixture.',
            'Captured CLI stdout/stderr and the original first timing match are persisted after the measured process duration.',
            'Hook intervals include diagnostic overhead and may overlap; they must not be added as pipeline phases.',
            'This workflow produces diagnostic evidence only. It does not rerun, replace or publish the original performance gate.',
            '',
          ].join('\n\n'))
          NODE
      - name: Upload completed and partial diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-import-build-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/auto-import-build-diagnostic
          if-no-files-found: error
          retention-days: 90
