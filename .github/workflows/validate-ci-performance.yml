name: Validate Performance Smoke
on:
  workflow_call:
    inputs:
      verification_topology:
        required: false
        type: string
        default: optimized-v1
      pr_context:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    if: inputs.verification_topology != 'optimized-v2'
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      profile: ci-performance

  smoke:
    needs: pr-context
    if: ${{ !cancelled() && (inputs.verification_topology == 'optimized-v2' || needs.pr-context.result == 'success') && ((inputs.verification_topology == 'optimized-v2' && (fromJSON(inputs.pr_context).isPr && 'true' || 'false') || needs.pr-context.outputs.is_pr) == 'true' && (inputs.verification_topology == 'optimized-v2' && ((fromJSON(inputs.pr_context).event == 'pull_request' && fromJSON(inputs.pr_context).selections['ci-performance'] || fromJSON(inputs.pr_context).event != 'pull_request' && fromJSON(inputs.pr_context).shouldRun) && 'true' || 'false') || needs.pr-context.outputs.should_run) == 'true') }}
    name: Performance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEAPP_VITE_VERIFICATION_TOPOLOGY: ${{ inputs.verification_topology }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headRepository || needs.pr-context.outputs.head_repository) }}
          ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headSha || needs.pr-context.outputs.head_sha) }}
          persist-credentials: false
      - name: Check out trusted scope driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .tmp/pr-driver
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/performanceGate
            scripts/verification/documentPolicy.mjs
            .github
          persist-credentials: false
      - name: Validate frozen head using the approved merge driver
        if: inputs.verification_topology == 'optimized-v2'
        uses: ./.tmp/pr-driver/.github/actions/verify-frozen-job-context
        with:
          context: ${{ inputs.pr_context }}
          profile: ci-performance
      - name: Select relevant paths
        id: scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFORMANCE_PR_NUMBER: ${{ (inputs.verification_topology == 'optimized-v2' && format('{0}', fromJSON(inputs.pr_context).prNumber || '') || needs.pr-context.outputs.pr_number) }}
          PERFORMANCE_HEAD_SHA: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headSha || needs.pr-context.outputs.head_sha) }}
          PERFORMANCE_BASE_SHA: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).baseSha || needs.pr-context.outputs.base_sha) }}
        run: node .tmp/pr-driver/scripts/performanceGate/smokeScope.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.needed == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.needed == 'true'
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check collector contracts
        if: steps.scope.outputs.needed == 'true'
        run: pnpm exec vitest run --config scripts/vitest.config.mjs scripts/performanceGate scripts/benchmarkTemplatesHmr scripts/benchmarkTemplatesPerformance/measuredBuild.test.ts scripts/performance-comment-workflow.test.ts
      - name: Run correctness smoke
        if: steps.scope.outputs.needed == 'true'
        env:
          PERFORMANCE_PURPOSE: smoke
          PERFORMANCE_PR_NUMBER: ${{ (inputs.verification_topology == 'optimized-v2' && format('{0}', fromJSON(inputs.pr_context).prNumber || '') || needs.pr-context.outputs.pr_number) }}
          PERFORMANCE_HEAD_SHA: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headSha || needs.pr-context.outputs.head_sha) }}
          TEMPLATES_PERF_OPTIMIZED_DIR: ${{ github.workspace }}
          TEMPLATES_PERF_REPORT_DIR: ${{ runner.temp }}/performance-smoke
        run: pnpm exec tsx scripts/performanceGate/smoke.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.scope.outputs.needed == 'true' }}
        with:
          name: performance-smoke-report
          path: ${{ runner.temp }}/performance-smoke
          if-no-files-found: warn
