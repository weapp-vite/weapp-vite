name: WXML preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: WXML preview version (0.1.0-alpha.N)
        required: true
        default: 0.1.0-alpha.0
        type: string
      dry-run:
        description: Check and pack without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  LEFTHOOK: 0
  npm_config_registry: https://registry.npmjs.org

jobs:
  preview:
    name: Check and publish WXML alpha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: npm-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PREVIEW_VERSION: ${{ inputs.version }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo '::error::WXML preview publication requires the default branch.'
            exit 1
          fi
          if [[ ! "$PREVIEW_VERSION" =~ ^0\.1\.0-alpha\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use an explicit 0.1.0-alpha.N preview version.'
            exit 1
          fi

      - name: Checkout the frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1 --registry=https://registry.npmjs.org

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the public WXML package
        run: |
          pnpm --filter @weapp-vite/wxml lint
          pnpm --filter @weapp-vite/wxml typecheck
          pnpm --filter @weapp-vite/wxml test
          pnpm --filter @weapp-vite/wxml build
          pnpm --filter @weapp-vite/wxml test:types:check

      - name: Prepare the exact preview tarball
        id: pack
        run: node --import tsx scripts/wxmlPreview/index.ts prepare

      - name: Publish using npm OIDC
        if: ${{ !inputs.dry-run }}
        env:
          PREVIEW_TARBALL: ${{ steps.pack.outputs.tarball }}
          NPM_CONFIG_PROVENANCE: true
        run: npm publish "$PREVIEW_TARBALL" --ignore-scripts --access public --tag alpha --provenance --registry=https://registry.npmjs.org

      - name: Confirm registry integrity, tag and provenance
        if: ${{ !inputs.dry-run }}
        env:
          PREVIEW_MANIFEST: ${{ steps.pack.outputs.manifest }}
        run: node --import tsx scripts/wxmlPreview/index.ts confirm "$PREVIEW_MANIFEST"

      - name: Verify the published package in an isolated consumer
        if: ${{ !inputs.dry-run }}
        run: |
          mkdir "$RUNNER_TEMP/wxml-consumer"
          cd "$RUNNER_TEMP/wxml-consumer"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "@weapp-vite/wxml@$PREVIEW_VERSION"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { parse, serialize } from '@weapp-vite/wxml';
          const source = '<view a="&amp;" a disabled>{{ value }}</view>';
          const result = parse(source);
          assert.deepEqual(result.diagnostics, []);
          assert.equal(serialize(result), source);
          console.log('Published WXML parser/serializer roundtrip passed.');
          NODE
          npm audit signatures --registry=https://registry.npmjs.org

      - name: Preserve preview evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wxml-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wxml-preview/*
          if-no-files-found: ignore
          retention-days: 14
