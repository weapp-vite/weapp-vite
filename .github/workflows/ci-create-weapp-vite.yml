name: Create Weapp Vite Smoke

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR 编号；留空保留当前分支或定时验证
        required: false
        default: ''
        type: string
      package-spec:
        description: npm dist-tag or version for create-weapp-vite
        required: false
        default: latest
        type: string
      full-matrix:
        description: run the full OS / Node matrix
        required: false
        default: false
        type: boolean
      os:
        description: target OS when full matrix is disabled
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      node-version:
        description: target Node.js version when full matrix is disabled
        required: false
        default: '24'
        type: choice
        options:
          - '22'
          - '24'
      templates:
        description: comma-separated template list
        required: false
        default: default,wevu,tailwindcss
        type: string
      scenarios:
        description: comma-separated package manager scenario list
        required: false
        default: pnpm
        type: string
      registries:
        description: comma-separated registry profiles (npmjs,npmmirror)
        required: false
        default: npmjs,npmmirror
        type: string
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.pr-number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      profile: ci-create-weapp-vite
  validation:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    uses: ./.github/workflows/validate-ci-create-weapp-vite.yml
    with:
      pr_context: ${{ needs.pr-context.outputs.pr_context }}
      package-spec: ${{ inputs.package-spec || 'latest' }}
      full-matrix: ${{ inputs.full-matrix || false }}
      os: ${{ inputs.os || 'ubuntu-latest' }}
      node-version: ${{ inputs.node-version || '24' }}
      templates: ${{ inputs.templates || 'default,wevu,tailwindcss' }}
      scenarios: ${{ inputs.scenarios || 'pnpm' }}
      registries: ${{ inputs.registries || 'npmjs,npmmirror' }}
    secrets: inherit
