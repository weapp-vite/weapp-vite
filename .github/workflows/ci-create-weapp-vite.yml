name: Create Weapp Vite Smoke

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR 编号；留空保留当前分支或定时验证
        required: false
        default: ''
        type: string
      package-spec:
        description: npm dist-tag or version for create-weapp-vite
        required: false
        default: latest
        type: string
      full-matrix:
        description: run the full OS / Node matrix
        required: false
        default: false
        type: boolean
      os:
        description: target OS when full matrix is disabled
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      node-version:
        description: target Node.js version when full matrix is disabled
        required: false
        default: '24'
        type: choice
        options:
          - '22'
          - '24'
      templates:
        description: comma-separated template list
        required: false
        default: default,wevu,tailwindcss
        type: string
      scenarios:
        description: comma-separated package manager scenario list
        required: false
        default: pnpm
        type: string
      registries:
        description: comma-separated registry profiles (npmjs,npmmirror)
        required: false
        default: npmjs,npmmirror
        type: string
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.pr-number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      paths: '["packages/create-weapp-vite/**","scripts/createWeappViteSmoke/**","scripts/create-weapp-vite-smoke.mjs","scripts/merge-create-weapp-vite-smoke-reports.mjs",".github/workflows/ci-create-weapp-vite.yml","templates/**","package.json","pnpm-lock.yaml"]'

  source-network-regression:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Scaffold Network Regression (${{ matrix.os }} / Node 22)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: 45
      build_command: ${{ matrix.os == 'windows-latest' && 'pnpm build:pkgs:ci:windows' || matrix.os == 'macos-latest' && 'pnpm build:pkgs:ci:macos' || 'pnpm build:pkgs:ci' }}
      main_command: |
        pnpm --filter create-weapp-vite typecheck
        pnpm --filter create-weapp-vite test:types
        pnpm --filter create-weapp-vite test
    secrets: inherit

  prepare:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true')
    name: Prepare Smoke Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      package_spec: ${{ steps.inputs.outputs.package_spec }}
      templates: ${{ steps.inputs.outputs.templates }}
      scenarios: ${{ steps.inputs.outputs.scenarios }}
      registries: ${{ steps.inputs.outputs.registries }}

    steps:
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve workflow inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE_SPEC: ${{ github.event.inputs['package-spec'] || '' }}
          INPUT_TEMPLATES: ${{ github.event.inputs.templates || '' }}
          INPUT_SCENARIOS: ${{ github.event.inputs.scenarios || '' }}
          INPUT_REGISTRIES: ${{ github.event.inputs.registries || '' }}
        run: |
          package_spec="${INPUT_PACKAGE_SPEC:-latest}"
          templates="${INPUT_TEMPLATES:-default,wevu,tailwindcss}"
          scenarios="${INPUT_SCENARIOS:-pnpm}"
          registries="${INPUT_REGISTRIES:-npmjs,npmmirror}"
          {
            echo "package_spec=${package_spec}"
            echo "templates=${templates}"
            echo "scenarios=${scenarios}"
            echo "registries=${registries}"
          } >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FULL_MATRIX: ${{ github.event.inputs['full-matrix'] || 'false' }}
          INPUT_OS: ${{ github.event.inputs.os || 'ubuntu-latest' }}
          INPUT_NODE_VERSION: ${{ github.event.inputs['node-version'] || '24' }}
        run: |
          full_matrix='{"include":[
            {"os":"ubuntu-latest","node-version":"22","scope":"core"},
            {"os":"windows-latest","node-version":"22","scope":"core"},
            {"os":"macos-latest","node-version":"22","scope":"core"},
            {"os":"ubuntu-latest","node-version":"24","scope":"core"},
            {"os":"windows-latest","node-version":"24","scope":"core"},
            {"os":"macos-latest","node-version":"24","scope":"core"},
            {"os":"ubuntu-latest","node-version":"24","scope":"all-templates","templates":"default,multi-platform,multi-platform-sfc,plugin,lib,wevu,react,wevu-tdesign,tailwindcss,tdesign,vant"}
          ]}'

          single_matrix="$(printf '{"include":[{"os":"%s","node-version":"%s","scope":"core"}]}' "${INPUT_OS}" "${INPUT_NODE_VERSION}")"

          if [[ "${EVENT_NAME}" == "schedule" || "${INPUT_FULL_MATRIX}" == "true" ]]; then
            matrix="${full_matrix}"
          else
            matrix="${single_matrix}"
          fi

          {
            echo 'matrix<<__CREATE_WEAPP_VITE_MATRIX__'
            echo "${matrix}"
            echo '__CREATE_WEAPP_VITE_MATRIX__'
          } >> "$GITHUB_OUTPUT"

          {
            echo "### smoke matrix"
            echo "- event: \`${EVENT_NAME}\`"
            echo "- full matrix: \`${INPUT_FULL_MATRIX}\`"
            echo "- selected matrix:"
            echo '```json'
            echo "${matrix}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: [pr-context, prepare]
    name: Create Smoke (${{ matrix.os }} / Node ${{ matrix.node-version }} / ${{ matrix.scope }})
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --system core.longpaths true

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr-context.outputs.checkout_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Print package manager versions
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          print_version() {
            local name="$1"
            shift
            echo "==> ${name}"
            if "$@"; then
              return 0
            fi
            echo "${name} unavailable"
            return 0
          }

          print_version node node -v
          print_version npm npm -v
          print_version pnpm pnpm -v
          print_version "smoke pnpm" corepack pnpm@12 -v
          print_version yarn yarn -v

      - name: Run create-weapp-vite smoke matrix
        env:
          CREATE_WEAPP_VITE_SPEC: ${{ needs.prepare.outputs.package_spec }}
          CREATE_WEAPP_VITE_TEMPLATES: ${{ matrix.templates || needs.prepare.outputs.templates }}
          CREATE_WEAPP_VITE_SCENARIOS: ${{ needs.prepare.outputs.scenarios }}
          CREATE_WEAPP_VITE_REGISTRIES: ${{ needs.prepare.outputs.registries }}
          CREATE_WEAPP_VITE_REPORT_FILE: ${{ runner.temp }}/create-weapp-vite-smoke-report/report.json
          CREATE_WEAPP_VITE_REPORT_OS: ${{ matrix.os }}
          CREATE_WEAPP_VITE_REPORT_NODE: ${{ matrix.node-version }}
        run: node ./scripts/create-weapp-vite-smoke.mjs

      - name: Upload smoke report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: create-weapp-vite-smoke-report-${{ matrix.os }}-node${{ matrix.node-version }}-${{ matrix.scope }}
          path: ${{ runner.temp }}/create-weapp-vite-smoke-report/report.json
          if-no-files-found: warn

  report:
    name: Smoke Report
    if: needs.pr-context.outputs.should_run == 'true' && (always() && needs.pr-context.outputs.is_pr != 'true')
    needs: [pr-context, smoke]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr-context.outputs.checkout_sha }}
          persist-credentials: false

      - name: Download smoke report artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: create-weapp-vite-smoke-report-*
          path: artifacts/create-weapp-vite-smoke-report
          merge-multiple: false

      - name: Merge smoke reports
        run: node ./scripts/merge-create-weapp-vite-smoke-reports.mjs artifacts/create-weapp-vite-smoke-report artifacts/create-weapp-vite-smoke-report-summary

      - name: Append report to workflow summary
        run: cat artifacts/create-weapp-vite-smoke-report-summary/create-weapp-vite-smoke-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged smoke report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: create-weapp-vite-smoke-report-summary
          path: artifacts/create-weapp-vite-smoke-report-summary
