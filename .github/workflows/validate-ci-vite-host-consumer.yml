name: Validate Vite Host Consumer
on:
  workflow_call:
    inputs:
      pr_context:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-context:
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      pr_context: ${{ inputs.pr_context }}
      profile: ci-vite-host-consumer
  consumer-platform:
    name: Consumer (${{ matrix.os }})
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    uses: ./.github/workflows/reusable-consumer-platform.yml
    with:
      pr_context: ${{ inputs.pr_context }}
      runs_on: ${{ matrix.os }}
    secrets: inherit
