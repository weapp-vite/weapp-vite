name: Validate Vite Host Consumer
on:
  workflow_call:
    inputs:
      pr_context:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      pr_context: ${{ inputs.pr_context }}
      profile: ci-vite-host-consumer

  node-support:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Published Node support (${{ matrix.os }} / Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.18.0, 24.11.0, 26.0.0, '22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.pr-context.outputs.checkout_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24'
      - uses: ./.github/actions/refresh-workspace-deps
        with:
          build-command: pnpm exec turbo run build --filter=weapp-vite... --filter=rolldown-require...
      - name: Pack candidates before switching to the consumer runtime
        run: node packages/weapp-vite/scripts/consumerTarballs.mjs .cache/node-support-tarballs
      - name: Install browser for published Web consumption
        run: pnpm exec playwright install --with-deps chromium
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify packed Dashboard public types without mini-program ambient globals
        run: node packages/weapp-vite/scripts/verify-dashboard-public-types.mjs
        env:
          WEAPP_VITE_CONSUMER_TARBALLS: .cache/node-support-tarballs
          WEAPP_VITE_DASHBOARD_TYPES_EVIDENCE: .cache/dashboard-public-types.json
      - name: Install and verify published native, SFC, Tailwind and Web consumers
        run: node packages/weapp-vite/scripts/verify-vite-host-install.mjs wv
        env:
          WEAPP_VITE_CONSUMER_TARBALLS: .cache/node-support-tarballs
          WEAPP_VITE_CONSUMER_WEB: '1'
          WEAPP_VITE_CONSUMER_EVIDENCE: .cache/consumer-evidence.json
          WEAPP_VITE_CONSUMER_DEPENDENCIES: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: consumer-evidence-${{ matrix.os }}-${{ matrix.node }}
          path: |
            .cache/consumer-evidence.json
            .cache/dashboard-public-types.json

  dependency-compatibility:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Strict dependency consumer (${{ matrix.os }} / ${{ matrix.manager }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        manager: [pnpm, npm]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=rolldown-require...
      main_command: pnpm exec cross-env WEAPP_VITE_DEPENDENCY_EVIDENCE=.cache/dependency-compatibility.json node packages/weapp-vite/scripts/verify-dependency-install.mjs ${{ matrix.manager }}
      artifact_name: dependency-compatibility-${{ matrix.os }}-${{ matrix.manager }}
      artifact_path: .cache/dependency-compatibility.json
    secrets: inherit

  react-host-paths:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: React host paths (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=@weapp-vite/react...
      main_command: pnpm vitest run packages/weapp-vite/test/vite-react.test.ts
    secrets: inherit

  watch-validation:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Watch validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite...
      main_command: >-
        pnpm --filter weapp-vite exec vitest run
        test/vite-watch-validation.test.ts test/vite-watch.test.ts test/vite-worker.test.ts
        test/wxml-transform-watch.test.ts
        src/vite/session.test.ts src/runtime/buildPlugin/workers.test.ts
    secrets: inherit

  route-topology:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Route topology (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite...
      main_command: >-
        pnpm vitest run packages/weapp-vite/src/plugins/core/lifecycle/autoRoutesTopology.test.ts
        packages/weapp-vite/src/plugins/core/lifecycle/watch.test.ts
        packages/weapp-vite/test/vite-watch.test.ts
    secrets: inherit

  host-paths:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Host paths (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite...
      main_command: >-
        pnpm vitest run packages/weapp-vite/src/runtime/libDts.test.ts
        packages/weapp-vite/src/runtime/compilerSession/session.test.ts
        packages/weapp-vite/test/vite-lib.test.ts
    secrets: inherit

  native-path-controls:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Native path controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=@weapp-vite/react... --filter=weapp-vite...
      main_command: >-
        pnpm --filter weapp-vite exec vitest run test/vite-native-path-controls.test.ts
        test/vite-native-watch-topology.test.ts
        src/plugins/tailwindcss/contentInvalidation.test.ts
        src/runtime/statefulHmr/snapshotAssetInputs.test.ts
    secrets: inherit

  consumer:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Packed consumer (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [wv, vite, vite-plus]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=rolldown-require...
      main_command: node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.toolchain }}
    secrets: inherit

  stateful-runtime:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Stateful runtime (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [wv, vite, vite-plus]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.host }} headless stateful
      artifact_name: stateful-runtime-${{ matrix.host }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  classic-runtime:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Classic runtime (${{ matrix.host }} / ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        host: [wv, vite, vite-plus]
        profile: [classic, classic-watch]
        exclude:
          - host: wv
            profile: classic-watch
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.host }} headless ${{ matrix.profile }}
      artifact_name: classic-runtime-${{ matrix.host }}-${{ matrix.profile }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  react-runtime:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: React runtime (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [wv, vite, vite-plus]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.host }} headless react
      artifact_name: react-runtime-${{ matrix.host }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  independent-runtime:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Independent runtime (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [wv, vite, vite-plus]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.host }} headless independent
      artifact_name: independent-runtime-${{ matrix.host }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  worker-runtime:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Worker runtime (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [wv, vite, vite-plus]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.host }} headless worker
      artifact_name: worker-runtime-${{ matrix.host }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  plugin-runtime:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Plugin runtime (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [wv, vite, vite-plus]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.host }} headless plugin
      artifact_name: plugin-runtime-${{ matrix.host }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  lib-runtime:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Library runtime (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [wv, vite, vite-plus]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.host }} headless lib
      artifact_name: lib-runtime-${{ matrix.host }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  platform-runtime:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Platform builds and runtime (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [wv, vite, vite-plus]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.host }} headless platform
      artifact_name: platform-runtime-${{ matrix.host }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  web-runtime:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    name: Web browser runtime (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [wv, vite, vite-plus]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: 24.18.0
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      install_playwright: true
      playwright_browsers: chromium
      main_command: |
        pnpm exec vitest run --config scripts/vitest.config.mjs scripts/hostCapabilityDiagnostic.test.mjs
        pnpm exec cross-env WEAPP_VITE_CONSUMER_HOST_DIAGNOSTICS=1 node packages/weapp-vite/scripts/verify-vite-host-install.mjs ${{ matrix.host }} headless web
      artifact_name: web-host-capability-${{ matrix.host }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .cache/web-consumer-diagnostic/host-capability-*.json
    secrets: inherit
