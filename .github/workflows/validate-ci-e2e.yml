name: Validate CI E2E
on:
  workflow_call:
    inputs:
      verification_topology:
        required: false
        type: string
        default: optimized-v1
      pr_context:
        required: true
        type: string
      hmr-diagnostic:
        type: string
        required: false
        default: full
      exclude-e2e-projects:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  pr-context:
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      pr_context: ${{ inputs.pr_context }}
      profile: ci-e2e
  native-compiler-batch-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'native-compiler-batch')
    name: Native Compiler Batch Diagnostic (${{ matrix.os }} / Node 24)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ${{ matrix.os }}
      node_version: '24'
      timeout_minutes: 20
      build_command: pnpm exec turbo run build --filter=weapp-vite...
      main_command: pnpm vitest run packages/weapp-vite/src/runtime/statefulHmr/compilerBatch.native.test.ts packages/weapp-vite/src/plugins/tailwindcss/contentInvalidation.test.ts packages/weapp-vite/src/plugins/tailwindcss/moduleDependencies.test.ts --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile=.tmp/native-compiler-batch-report.json
      artifact_name: native-compiler-batch-${{ matrix.os }}-node-24-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .tmp/native-compiler-batch-report.json
    secrets: inherit
  windows-dev-cleanup-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'windows-dev-cleanup')
    name: Dev Process Cleanup Shard Diagnostic (Windows / Node ${{ matrix.node-version }} / shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            shard: 3
          - node-version: 22
            shard: 1
          - node-version: 24
            shard: 1
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: windows-latest
      node_version: ${{ format('{0}', matrix.node-version) }}
      timeout_minutes: 40
      build_command: pnpm build:ci:windows
      main_command: pnpm exec cross-env WEAPP_VITE_E2E_CLEANUP_TRACE=1 pnpm e2e:ci:full -- --shard-index=${{ matrix.shard }} --shard-total=4
      e2e_platform: weapp
      artifact_name: windows-dev-cleanup-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: docs/reports/*-e2e-ci-full-*-suite-report/**
    secrets: inherit
  windows-process-narrow-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'windows-process-narrow')
    name: Suite Runner Process Diagnostic (Windows / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: windows-latest
      node_version: ${{ format('{0}', matrix.node-version) }}
      timeout_minutes: 15
      build_command: pnpm exec turbo run build --filter=weapp-ide-cli...
      main_command: pnpm exec cross-env NODE_DEBUG=weapp-ide-journal-writer pnpm vitest run -c e2e/vitest.e2e.internal.config.ts e2e/scripts/suiteRunner/process.test.ts --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile=.tmp/windows-process-narrow-report.json
      artifact_name: windows-process-narrow-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .tmp/windows-process-narrow-report.json
    secrets: inherit
  windows-native-runtime-cleanup-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'windows-native-runtime-cleanup')
    name: Native Runtime Cleanup Diagnostic (Windows / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: windows-latest
      node_version: ${{ format('{0}', matrix.node-version) }}
      timeout_minutes: 15
      build_command: pnpm exec turbo run build --filter=weapp-vite...
      main_command: pnpm exec cross-env WEAPP_VITE_E2E_CLEANUP_TRACE=1 WEAPP_VITE_E2E_DEV_PROCESS_TRACE=1 WEAPP_VITE_E2E_DEV_SHUTDOWN_TRACE=1 WEAPP_VITE_E2E_DEV_PROCESS_TRACE_DIR=.tmp/windows-native-runtime-cleanup/dev-process pnpm vitest run -c e2e/vitest.e2e.internal.config.ts e2e/utils/runtimeDevProcess.integration.test.ts --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile=.tmp/windows-native-runtime-cleanup/report.json
      artifact_name: windows-native-runtime-cleanup-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .tmp/windows-native-runtime-cleanup/**
    secrets: inherit
  windows-startup-fallback-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'windows-startup-fallback')
    name: Startup Fallback Cleanup Diagnostic (Windows / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: windows-latest
      node_version: ${{ format('{0}', matrix.node-version) }}
      timeout_minutes: 20
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=@mpcore/simulator...
      main_command: pnpm exec cross-env WEAPP_VITE_E2E_RUNTIME_PROVIDER=headless WEAPP_VITE_E2E_DOM_ACCEPTANCE=1 WEAPP_VITE_E2E_CLEANUP_TRACE=1 WEAPP_VITE_E2E_DEV_PROCESS_TRACE=1 WEAPP_VITE_E2E_DEV_SHUTDOWN_TRACE=1 WEAPP_VITE_E2E_DEV_PROCESS_TRACE_DIR=.tmp/windows-startup-fallback/dev-process pnpm vitest run -c e2e/vitest.e2e.headless.config.ts e2e/ide/hmr-startup-fallback.runtime.test.ts --reporter=default --reporter=json --reporter=./e2e/scripts/domAcceptanceReport/reporter.ts --outputFile=.tmp/windows-startup-fallback/report.json
      e2e_platform: weapp
      artifact_name: windows-startup-fallback-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: |
        .tmp/windows-startup-fallback/**
        docs/reports/dom-acceptance/**
    secrets: inherit
  plugin-watch-readiness-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'plugin-watch-readiness')
    name: Plugin Watch Readiness (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 22
          - 24
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ${{ matrix.os }}
      node_version: ${{ format('{0}', matrix.node-version) }}
      timeout_minutes: 20
      build_command: pnpm exec turbo run build --filter=weapp-vite...
      main_command: pnpm vitest run packages/weapp-vite/test/vite-plugin-project.test.ts --reporter=default --reporter=json --outputFile=.tmp/plugin-watch-readiness-report.json
      artifact_name: plugin-watch-readiness-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .tmp/plugin-watch-readiness-report.json
    secrets: inherit
  runtime-publication-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'runtime-publication')
    name: Runtime Publication Regression (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 22
          - 24
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ${{ matrix.os }}
      node_version: ${{ format('{0}', matrix.node-version) }}
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=@mpcore/simulator...
      main_command: |
        pnpm vitest run e2e/utils/devBuildCompletion.test.ts e2e/utils/hmrOutputDiagnostics.test.ts e2e/scripts/e2e-suite-manifest.test.ts e2e/scripts/hmr-guard-manifest.test.ts
        pnpm exec vitest run --config scripts/vitest.config.mjs scripts/workspace-hmr/statefulArtifactMeasurement.test.ts scripts/workspace-hmr/statefulArtifactMeasurement.deadline.test.ts scripts/workspace-hmr/statefulAuditClient.test.ts scripts/workspace-hmr/statefulAuditUpdate.test.ts scripts/e2e-diagnostic-workflow.test.ts scripts/repoctl-release-workflow.test.ts scripts/utils/atomicRename.test.ts scripts/editSequence/buildSources.test.ts scripts/editSequence/frameworkSources.test.ts
        pnpm vitest run -c e2e/vitest.e2e.ci.config.ts e2e/ci/auto-import-vue-sfc.test.ts e2e/ci/external-linked-vue-component.hmr.test.ts
        pnpm exec cross-env WEAPP_VITE_E2E_RUNTIME_PROVIDER=headless WEAPP_VITE_E2E_DOM_ACCEPTANCE=1 pnpm vitest run -c e2e/vitest.e2e.headless.config.ts e2e/ide/issue-1134-native-topology.runtime.test.ts e2e/ide/script-setup-external-src.runtime.test.ts e2e/ide/issue-1015-css-hmr.runtime.test.ts e2e/ide/issue-1140-mode-cache.runtime.test.ts e2e/ide/issue-1058-template-tags.runtime.test.ts
      e2e_platform: weapp
      artifact_name: runtime-publication-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit
  lifecycle-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'lifecycle')
    name: HMR Lifecycle Regression (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 22
          - 24
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ${{ matrix.os }}
      node_version: ${{ format('{0}', matrix.node-version) }}
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=@mpcore/simulator...
      main_command: |
        pnpm vitest run packages/weapp-vite/src/utils/watchDependencies.test.ts packages/weapp-vite/src/runtime/statefulHmr/snapshotInputs.test.ts packages/weapp-vite/src/runtime/statefulHmr/snapshotBuild.integration.test.ts scripts/editSequence/processTree.test.ts scripts/editSequence/processTree.windows.integration.test.ts scripts/editSequence/processObserver.test.ts scripts/editSequence/processObserverClose.test.ts scripts/editSequence/worker.test.ts scripts/utils/atomicRename.test.ts scripts/editSequence/buildSources.test.ts scripts/editSequence/frameworkSources.test.ts
        pnpm vitest run -c e2e/vitest.e2e.ci.config.ts e2e/ci/edit-sequence.test.ts --reporter=default --reporter=json --outputFile=.tmp/hmr-lifecycle-report.json
      e2e_platform: weapp
      artifact_name: hmr-lifecycle-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .tmp/hmr-lifecycle-report.json
    secrets: inherit
  shared-layout-windows-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'shared-layout-windows')
    name: Shared Layout HMR Diagnostic (Windows / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: windows-latest
      node_version: ${{ format('{0}', matrix.node-version) }}
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci:windows
      main_command: pnpm vitest run -c e2e/vitest.e2e.ci.config.ts e2e/ci/hmr-layout-shared-template-wxs.test.ts
      e2e_platform: weapp
    secrets: inherit
  shared-compiler-hosts:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && ((needs.pr-context.outputs.is_pr == 'true' || github.event_name == 'workflow_dispatch') && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Shared Compiler Hosts (${{ matrix.os }} / Node 24)
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ${{ matrix.os }}
      node_version: '24'
      timeout_minutes: 30
      build_command: pnpm --filter weapp-vite... --filter @mpcore/simulator... build
      main_command: |
        node integrations/shared-hmr-tailwind/prepare.mjs
        node integrations/shared-hmr-tailwind/verify-install.mjs
        node integrations/shared-hmr-tailwind/verify-isolated.mjs
        node integrations/shared-hmr-tailwind/run-taro.mjs --build
        pnpm exec cross-env WEAPP_VITE_E2E_RUNTIME_PROVIDER=headless WEAPP_VITE_E2E_DOM_ACCEPTANCE=1 pnpm vitest run -c e2e/vitest.e2e.headless.config.ts e2e/ide/shared-taro-hmr.runtime.test.ts
      artifact_name: shared-compiler-hosts-${{ matrix.os }}
      artifact_path: |
        docs/reports/dom-acceptance/**
        .tmp/shared-hosts/artifacts.json
    secrets: inherit
  miniapp-platform-build-gate:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Miniapp Platform Build Gate (Ubuntu / Node 22)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ubuntu-latest
      node_version: '22'
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:platform:build
    secrets: inherit
  bun-build-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'bun-cli')
    name: Bun Build Artifact (${{ matrix.os }} / Node 22)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-command: pnpm build:pkgs:ci
          - os: windows-latest
            build-command: pnpm build:pkgs:ci:windows
          - os: macos-latest
            build-command: pnpm build:pkgs:ci:macos
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: 40
      build_command: ${{ matrix.build-command }}
      main_command: node -e "console.log('Bun workspace build artifact ready')"
      build_artifact_name: miniapp-${{ matrix.os }}-node-22-weapp-build
    secrets: inherit
  web-e2e-baseline-pr:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Web E2E Baseline (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: macos-latest
      node_version: '24'
      timeout_minutes: 35
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web
      install_playwright: true
      artifact_name: web-runtime-visual-pr
      artifact_path: |
        .tmp/web-runtime-visual/**
        .tmp/web-runtime-diagnostics/**
        .tmp/uview-plus-compat/web/**
        .tmp/wot-ui-compat/web/**
    secrets: inherit
  web-project-builds:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && ((!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Web Project Builds (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 45
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web:build-projects
    secrets: inherit
  web-browser-smoke:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && ((!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Web Browser Smoke (Firefox / WebKit / Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 45
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web:browser-smoke
      install_playwright: true
      playwright_browsers: firefox webkit
    secrets: inherit
  workspace-hmr-pr:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full' || inputs.hmr-diagnostic == 'workspace-hmr') && !startsWith(needs.pr-context.outputs.head_ref, 'release/pnpm-version'))
    name: Workspace HMR Changed Projects (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 60
      fetch_depth: 0
      build_command: pnpm build:pkgs:ci
      main_command: pnpm audit:hmr:changed
      increase_ulimit: true
      artifact_name: workspace-hmr-pr
      artifact_path: .tmp/workspace-hmr/**
    secrets: inherit
  workspace-hmr-nightly:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full' || inputs.hmr-diagnostic == 'workspace-hmr'))
    name: Workspace HMR Nightly Full (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 120
      fetch_depth: 0
      build_command: pnpm build:pkgs:ci
      main_command: pnpm audit:hmr:nightly
      increase_ulimit: true
      artifact_name: workspace-hmr-nightly
      artifact_path: .tmp/workspace-hmr/**
    secrets: inherit
  web-e2e-baseline-full:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Web E2E Baseline (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version:
          - 22
          - 24
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: macos-latest
      node_version: ${{ format('{0}', matrix.node-version) }}
      timeout_minutes: 35
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web
      install_playwright: true
      artifact_name: web-runtime-visual-node-${{ matrix.node-version }}
      artifact_path: |
        .tmp/web-runtime-visual/**
        .tmp/web-runtime-diagnostics/**
        .tmp/uview-plus-compat/web/**
        .tmp/wot-ui-compat/web/**
    secrets: inherit
  miniapp-platform-pr:
    name: Miniapp (${{ matrix.os }} / Node ${{ matrix.node-version }})
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
            build-command: pnpm build:pkgs:ci
            node-version: 22
          - platform: weapp
            os: windows-latest
            build-command: pnpm build:pkgs:ci:windows
            node-version: 22
          - platform: weapp
            os: macos-latest
            build-command: pnpm build:pkgs:ci:macos
            node-version: 22
    uses: ./.github/workflows/reusable-miniapp-platform.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      runs_on: ${{ matrix.os }}
      node_version: ${{ format('{0}', matrix.node-version) }}
      build_command: ${{ matrix.build-command }}
      mode: pr
      exclude_projects: ${{ inputs.exclude-e2e-projects }}
    secrets: inherit
  miniapp-platform-full:
    name: Miniapp (${{ matrix.os }} / Node ${{ matrix.node-version }})
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:macos
          - platform: weapp
            os: ubuntu-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:macos
    uses: ./.github/workflows/reusable-miniapp-platform.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      runs_on: ${{ matrix.os }}
      node_version: ${{ format('{0}', matrix.node-version) }}
      build_command: ${{ matrix.build-command }}
      mode: full
      exclude_projects: ${{ inputs.exclude-e2e-projects }}
    secrets: inherit
  bun-cli:
    if: ${{ !cancelled() && needs.pr-context.outputs.should_run == 'true' && needs.bun-build-diagnostic.result == 'success' }}
    needs:
      - pr-context
      - bun-build-diagnostic
    name: Bun CLI (${{ matrix.os }} / Bun ${{ matrix.bun-version }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        bun-version:
          - 1.4.2
          - latest
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      e2e_exclude_projects: ${{ inputs.exclude-e2e-projects }}
      runs_on: ${{ matrix.os }}
      node_version: '22'
      bun_version: ${{ matrix.bun-version }}
      timeout_minutes: 15
      consume_build_artifact: miniapp-${{ matrix.os }}-node-22-weapp-build
      main_command: |
        bun --version
        pnpm e2e:bun
      artifact_name: bun-cli-${{ matrix.os }}-${{ matrix.bun-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: |
        .tmp/bun-cli/**
        docs/reports/*-e2e-bun-*-suite-report/**
    secrets: inherit
