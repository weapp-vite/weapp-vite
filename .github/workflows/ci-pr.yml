name: PR CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('PR CI refresh #{0} head={1} base={2} merge={3}', inputs.pr-number, inputs.head-sha, inputs.base-sha, inputs.merge-sha) || github.event.pull_request.title }}
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string
      head-sha:
        required: true
        type: string
      base-sha:
        required: true
        type: string
      merge-sha:
        required: true
        type: string
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  approval:
    name: Approve PR checks
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: pr-ci-approval
    timeout-minutes: 5
    steps:
      - name: Approve this revision
        run: echo "PR checks approved for this revision"
  plan:
    name: Freeze approved PR target
    needs: approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_context: ${{ steps.context.outputs.pr_context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: '24'

      - id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/native-pr-context.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-context
          path: .tmp/pr-context/context.json
          if-no-files-found: error
  ci:
    name: CI
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci'] }}
    uses: ./.github/workflows/validate-ci.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-policy:
    name: CI Policy
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-policy'] }}
    uses: ./.github/workflows/validate-ci-policy.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-e2e:
    name: CI E2E
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-e2e'] }}
    uses: ./.github/workflows/validate-ci-e2e.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-create-weapp-vite:
    name: Create Weapp Vite Smoke
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-create-weapp-vite'] }}
    uses: ./.github/workflows/validate-ci-create-weapp-vite.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-acceptance-http:
    name: Acceptance HTTP
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-acceptance-http'] }}
    uses: ./.github/workflows/validate-ci-acceptance-http.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-acceptance:
    name: Acceptance and Agent
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-acceptance'] }}
    uses: ./.github/workflows/validate-ci-acceptance.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-dimina:
    name: Dimina Web Experiment
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-dimina'] }}
    uses: ./.github/workflows/validate-ci-dimina.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-vite-host-consumer:
    name: Vite Host Consumer
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-vite-host-consumer'] }}
    uses: ./.github/workflows/validate-ci-vite-host-consumer.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-vscode-extension:
    name: VSCode Extension CI
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-vscode-extension'] }}
    uses: ./.github/workflows/validate-ci-vscode-extension.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-tutorial-e2e:
    name: Tutorial E2E
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-tutorial-e2e'] }}
    uses: ./.github/workflows/validate-ci-tutorial-e2e.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  deploy-website:
    name: Deploy Website
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['deploy-website'] }}
    uses: ./.github/workflows/validate-deploy-website.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  native-addon-correctness:
    name: Native Addon Correctness
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['native-addon-correctness'] }}
    uses: ./.github/workflows/validate-native-addon-correctness.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  ci-performance:
    name: Performance Smoke
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['ci-performance'] }}
    uses: ./.github/workflows/validate-ci-performance.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  wevu-runtime-size:
    name: Wevu Runtime Size
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).selections['wevu-runtime-size'] }}
    uses: ./.github/workflows/validate-wevu-runtime-size.yml
    with:
      pr_context: ${{ needs.plan.outputs.pr_context }}
      verification_topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
  documentation:
    name: Root documentation policy
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.pr_context).documentationOnly }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEAPP_VITE_VERIFICATION_TOPOLOGY: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(needs.plan.outputs.pr_context).checkoutSha }}
          persist-credentials: false
      - uses: ./.github/actions/verify-frozen-job-context
        with:
          context: ${{ needs.plan.outputs.pr_context }}
          profile: documentation
          verification-topology: ${{ fromJSON(needs.plan.outputs.pr_context).verificationTopology }}
      - uses: ./.github/actions/setup-node-pnpm
        if: fromJSON(needs.plan.outputs.pr_context).documentationPaths[0] != null || fromJSON(needs.plan.outputs.pr_context).documentationChecks[0] != null
        with:
          node-version: '24'
          install-dependencies: 'false'
      - uses: ./.github/actions/install-workspace-deps
        if: fromJSON(needs.plan.outputs.pr_context).documentationPaths[0] != null || fromJSON(needs.plan.outputs.pr_context).documentationChecks[0] != null
        with:
          ignore-scripts: 'true'
      - name: Lint exactly the frozen surviving documentation paths
        env:
          PR_DOCUMENTATION_CHECKS: ${{ toJSON(fromJSON(needs.plan.outputs.pr_context).documentationChecks) }}
          PR_DOCUMENTATION_PATHS: ${{ toJSON(fromJSON(needs.plan.outputs.pr_context).documentationPaths) }}
        run: node .github/scripts/lint-frozen-documentation.mjs
  verdict:
    name: PR snapshot checks
    needs:
      - approval
      - plan
      - ci
      - ci-policy
      - ci-e2e
      - ci-create-weapp-vite
      - ci-acceptance-http
      - ci-acceptance
      - ci-dimina
      - ci-vite-host-consumer
      - ci-vscode-extension
      - ci-tutorial-e2e
      - deploy-website
      - native-addon-correctness
      - ci-performance
      - wevu-runtime-size
      - documentation
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ success() && !cancelled() && needs.approval.result == 'success' && needs.plan.result == 'success' }}
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        if: ${{ success() && !cancelled() && needs.approval.result == 'success' && needs.plan.result == 'success' }}
        with:
          node-version: '24'
      - id: snapshot
        name: Check frozen snapshot results
        if: ${{ success() && !cancelled() && needs.approval.result == 'success' && needs.plan.result == 'success' }}
        env:
          PR_FROZEN_CONTEXT: ${{ needs.plan.outputs.pr_context }}
          PR_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/native-pr-verdict.mjs
      - name: Require successful terminal result
        if: always()
        env:
          PR_APPROVAL_RESULT: ${{ needs.approval.result }}
          PR_PLAN_RESULT: ${{ needs.plan.result }}
          PR_VERDICT_RESULT: ${{ steps.snapshot.outcome }}
        run: |
          test "$PR_APPROVAL_RESULT" = success
          test "$PR_PLAN_RESULT" = success
          test "$PR_VERDICT_RESULT" = success
      - name: Reject cancelled run
        if: cancelled()
        run: exit 1
