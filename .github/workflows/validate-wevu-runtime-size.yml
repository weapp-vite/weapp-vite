name: Validate Wevu Runtime Size
on:
  workflow_call:
    inputs:
      verification_topology:
        required: false
        type: string
        default: optimized-v1
      pr_context:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    if: inputs.verification_topology != 'optimized-v2'
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      profile: wevu-runtime-size

  measure:
    needs: pr-context
    if: ${{ !cancelled() && (inputs.verification_topology == 'optimized-v2' || needs.pr-context.result == 'success') && ((inputs.verification_topology == 'optimized-v2' && (fromJSON(inputs.pr_context).isPr && 'true' || 'false') || needs.pr-context.outputs.is_pr) == 'true' && (inputs.verification_topology == 'optimized-v2' && ((fromJSON(inputs.pr_context).event == 'pull_request' && fromJSON(inputs.pr_context).selections['wevu-runtime-size'] || fromJSON(inputs.pr_context).event != 'pull_request' && fromJSON(inputs.pr_context).shouldRun) && 'true' || 'false') || needs.pr-context.outputs.should_run) == 'true' && !startsWith((inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headRef || needs.pr-context.outputs.head_ref), 'release/pnpm-version')) }}
    name: Runtime Size (Ubuntu / Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      WEAPP_VITE_VERIFICATION_TOPOLOGY: ${{ inputs.verification_topology }}
    steps:
      - name: Check out head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          repository: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headRepository || needs.pr-context.outputs.head_repository) }}
          ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headSha || needs.pr-context.outputs.head_sha) }}
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).baseSha || needs.pr-context.outputs.base_sha) }}
          persist-credentials: false

      - name: Check out frozen validation driver independently of the PR head
        if: inputs.verification_topology == 'optimized-v2'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .tmp/pr-validation-driver
          sparse-checkout: |
            .github
            scripts/verification/documentPolicy.mjs
          persist-credentials: false
      - name: Validate frozen head using the approved merge driver
        if: inputs.verification_topology == 'optimized-v2'
        uses: ./.tmp/pr-validation-driver/.github/actions/verify-frozen-job-context
        with:
          context: ${{ inputs.pr_context }}
          profile: wevu-runtime-size
          working-directory: head

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: head/package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            head/pnpm-lock.yaml
            baseline/pnpm-lock.yaml

      - name: Install head dependencies
        working-directory: head
        run: pnpm install --frozen-lockfile

      - name: Install baseline dependencies
        working-directory: baseline
        run: pnpm install --frozen-lockfile

      - name: Build head runtime dependencies
        working-directory: head
        run: pnpm --filter '@weapp-vite/web...' build

      - name: Build baseline runtime dependencies
        working-directory: baseline
        run: pnpm --filter '@weapp-vite/web...' build

      # 主线可信评论脚本升级前仍读取 v2 投影；完整矩阵保留在独立 artifact 与 job summary。
      - name: Measure head and baseline
        working-directory: head
        env:
          BASE_SHA: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).baseSha || needs.pr-context.outputs.base_sha) }}
          HEAD_SHA: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headSha || needs.pr-context.outputs.head_sha) }}
          PR_NUMBER: ${{ (inputs.verification_topology == 'optimized-v2' && format('{0}', fromJSON(inputs.pr_context).prNumber || '') || needs.pr-context.outputs.pr_number) }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pnpm exec tsx scripts/report-wevu-runtime-size.ts \
            --root=../baseline \
            --output-json=../runtime-size-artifact/baseline.json
          pnpm exec tsx scripts/report-wevu-runtime-size.ts \
            --root=. \
            --baseline-json=../runtime-size-artifact/baseline.json \
            --output-json=../runtime-size-artifact/head.json \
            --output-markdown=../runtime-size-artifact/report.md \
            --artifact-json=../runtime-size-artifact/report-full.json \
            --legacy-artifact-json=../runtime-size-artifact/report.json \
            --repository="$REPOSITORY" \
            --pr-number="$PR_NUMBER" \
            --head-sha="$HEAD_SHA" \
            --base-sha="$BASE_SHA" \
            --github-summary \
            --check

      - name: Upload runtime size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wevu-runtime-size-report
          path: runtime-size-artifact
          if-no-files-found: error

      - name: Upload complete runtime size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wevu-runtime-size-report-full
          path: |
            runtime-size-artifact/report-full.json
            runtime-size-artifact/report.md
          if-no-files-found: error
