name: Reusable Node Command

on:
  workflow_call:
    outputs:
      node_version:
        description: Actual full Node.js version used by this command
        value: ${{ jobs.run.outputs.node_version }}
      node_support_matrix:
        description: Unique exact Node versions with every logical support role
        value: ${{ jobs.run.outputs.node_support_matrix }}
      consumer_batch_matrix:
        description: Four batches and their exact browser requirements
        value: ${{ jobs.run.outputs.consumer_batch_matrix }}
    inputs:
      verification_topology:
        required: false
        type: string
        default: optimized-v1
      pr_context:
        required: false
        type: string
        default: ''
      pr_profile:
        required: false
        type: string
        default: ''
      require_history:
        required: false
        type: boolean
        default: false
      fetch_base:
        required: false
        type: boolean
        default: false
      resolve_node_support:
        required: false
        type: boolean
        default: false
      prepare_consumer_batches:
        required: false
        type: boolean
        default: false
      plan_artifact_name:
        required: false
        type: string
        default: ''
      consume_plan_artifact:
        required: false
        type: string
        default: ''
      runs_on:
        required: true
        type: string
      node_version:
        required: true
        type: string
      bun_version:
        required: false
        type: string
        default: ''
      timeout_minutes:
        required: true
        type: number
      fetch_depth:
        required: false
        type: number
        default: 2
      checkout_ref:
        required: false
        type: string
        default: ''
      pr_number:
        required: false
        type: string
        default: ''
      base_sha:
        required: false
        type: string
        default: ''
      head_sha:
        required: false
        type: string
        default: ''
      head_ref:
        required: false
        type: string
        default: ''
      base_ref:
        required: false
        type: string
        default: ''
      build_command:
        required: false
        type: string
        default: ''
      main_command:
        required: true
        type: string
      e2e_platform:
        required: false
        type: string
        default: ''
      e2e_exclude_projects:
        required: false
        type: string
        default: ''
      install_playwright:
        required: false
        type: boolean
        default: false
      playwright_browsers:
        required: false
        type: string
        default: chromium
      increase_ulimit:
        required: false
        type: boolean
        default: false
      upload_codecov:
        required: false
        type: boolean
        default: false
      artifact_name:
        required: false
        type: string
        default: ''
      artifact_path:
        required: false
        type: string
        default: ''
      build_artifact_name:
        required: false
        type: string
        default: ''
      consume_build_artifact:
        required: false
        type: string
        default: ''
      lint_command:
        required: false
        type: string
        default: ''
      test_command:
        required: false
        type: string
        default: ''
      contracts_command:
        required: false
        type: string
        default: ''
      timing_artifact_name:
        required: false
        type: string
        default: ''
      consume_aux_artifact:
        required: false
        type: string
        default: ''
      aux_artifact_path:
        required: false
        type: string
        default: .tmp/verification-plan
      build_artifact_scope:
        required: false
        type: string
        default: ''
      build_artifact_node_major:
        required: false
        type: string
        default: ''
      consumer_tarballs:
        type: string
        required: false
        default: ''
      verification_telemetry:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      node_version: ${{ steps.toolchain.outputs.node-version }}
      node_support_matrix: ${{ steps.node-support-plan.outputs.matrix }}
      consumer_batch_matrix: ${{ steps.consumer-batch-plan.outputs.matrix }}
    env:
      WEAPP_VITE_VERIFICATION_TOPOLOGY: ${{ inputs.verification_topology }}
      TURBO_TOKEN: ${{ inputs.pr_number == '' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      BUILD_ARTIFACT_EXPECTED_NODE_MAJOR: ${{ inputs.build_artifact_node_major || (startsWith(inputs.node_version, '22') && '22' || startsWith(inputs.node_version, '26') && '26' || '24') }}
      BUILD_ARTIFACT_EXPECTED_COMMIT: ${{ inputs.checkout_ref || github.sha }}
      PR_BASE_SHA: ${{ inputs.base_sha }}
      PR_HEAD_REF: ${{ inputs.head_ref }}
      WEAPP_VITE_E2E_EXCLUDE_PROJECTS: ${{ inputs.e2e_exclude_projects }}
      BUILD_ARTIFACT_EXPECTED_SCOPE: ${{ inputs.build_artifact_scope }}
      WEAPP_VITE_CONSUMER_TARBALLS: ${{ inputs.consumer_tarballs }}
      WEAPP_VITE_VERIFICATION_TELEMETRY: ${{ inputs.verification_telemetry && '1' || '' }}

    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --system core.longpaths true
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: ${{ inputs.verification_topology != 'optimized-v2' && inputs.pr_number != '' && '0' || inputs.require_history && '0' || inputs.fetch_depth }}
          persist-credentials: false
      - name: Validate frozen identity in the executing job
        if: inputs.verification_topology == 'optimized-v2'
        uses: ./.github/actions/verify-frozen-job-context
        with:
          context: ${{ inputs.pr_context }}
          profile: ${{ inputs.pr_profile }}
      - name: Fetch frozen PR base
        if: inputs.base_sha != '' && (inputs.verification_topology != 'optimized-v2' || inputs.fetch_base)
        shell: bash
        env:
          PR_BASE_SHA: ${{ inputs.base_sha }}
        run: git fetch --no-tags origin "$PR_BASE_SHA"
      - uses: ./.github/actions/setup-node-pnpm
        id: toolchain
        with:
          node-version: ${{ inputs.node_version }}
          install-dependencies: ${{ inputs.verification_topology != 'optimized-v2' || inputs.consume_build_artifact == '' }}
      - name: Restore trusted workspace task cache
        if: inputs.verification_topology != 'optimized-v2' || inputs.build_command != '' || inputs.lint_command != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ env.REPOCTL_RELEASE_NODE_VERSION }}-${{ env.REPOCTL_RELEASE_PNPM_VERSION }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ inputs.checkout_ref || github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-${{ env.REPOCTL_RELEASE_NODE_VERSION }}-${{ env.REPOCTL_RELEASE_PNPM_VERSION }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-
      - name: Install Bun runtime
        if: inputs.bun_version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - if: inputs.build_command != '' && inputs.consume_build_artifact == ''
        uses: ./.github/actions/refresh-workspace-deps
        with:
          build-command: ${{ inputs.build_command }}
      - name: Download workspace build artifact
        if: inputs.consume_build_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.consume_build_artifact }}
          path: .
      - name: Refresh workspace links after artifact restore
        if: inputs.consume_build_artifact != '' && inputs.verification_topology != 'optimized-v2'
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/verify-build-artifact-manifest.mjs
      - name: Install once after restoring immutable workspace artifacts
        if: inputs.consume_build_artifact != '' && inputs.verification_topology == 'optimized-v2'
        uses: ./.github/actions/install-workspace-deps
      - name: Verify restored workspace artifact identity
        if: inputs.consume_build_artifact != '' && inputs.verification_topology == 'optimized-v2'
        run: node scripts/verify-build-artifact-manifest.mjs
      - name: Download auxiliary verification artifact
        if: inputs.consume_aux_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.consume_aux_artifact }}
          path: ${{ inputs.aux_artifact_path }}
      - name: Download frozen consumer verification plans
        if: inputs.consume_plan_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.consume_plan_artifact }}
          path: .tmp/consumer-plan
      - name: Pack local consumer archives with common immutable provenance
        if: inputs.consumer_tarballs != '' && inputs.consume_aux_artifact == ''
        run: node scripts/consumerArtifacts/manifest.mjs pack "${{ inputs.consumer_tarballs }}"
      - name: Verify immutable consumer archives
        if: inputs.consumer_tarballs != ''
        run: node scripts/consumerArtifacts/manifest.mjs verify "${{ inputs.consumer_tarballs }}"
      - name: Create workspace build artifact manifest
        if: inputs.build_artifact_name != ''
        shell: bash
        run: |
          export GITHUB_SHA="$BUILD_ARTIFACT_EXPECTED_COMMIT"
          node scripts/create-build-artifact-manifest.mjs
      - name: Freeze baseline verification evidence plans
        if: inputs.verification_telemetry && inputs.build_artifact_name != ''
        run: node --import tsx scripts/verificationTelemetry/cli.mjs prepare-suites --mode=${{ inputs.pr_number != '' && 'pr' || 'full' }}
      - name: Freeze installed Playwright browser revisions
        if: inputs.install_playwright && (inputs.verification_topology == 'optimized-v2' || github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        id: playwright-cache
        shell: bash
        env:
          PLAYWRIGHT_REQUESTED_BROWSERS: ${{ inputs.playwright_browsers }}
        run: node scripts/playwrightCache.mjs "$PLAYWRIGHT_REQUESTED_BROWSERS"
      - name: Restore trusted Playwright browser revisions
        if: inputs.verification_topology == 'optimized-v2' && inputs.install_playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.playwright-cache.outputs.path }}
          key: ${{ steps.playwright-cache.outputs.key }}
      - name: Install Playwright browsers and system dependencies
        if: inputs.install_playwright && runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\#azure.archive.ubuntu.com#d' /etc/apt/apt-mirrors.txt
          fi
          pnpm exec playwright install --with-deps ${{ inputs.playwright_browsers }}
      - name: Install Playwright browsers
        if: inputs.install_playwright && runner.os != 'Linux'
        run: pnpm exec playwright install ${{ inputs.playwright_browsers }}
      - name: Run lint phase
        if: inputs.lint_command != ''
        shell: bash
        env:
          E2E_PLATFORM: ${{ inputs.e2e_platform }}
        run: |-
          node .github/scripts/ci-timing.mjs start lint
          trap 'phase_exit=$?; node .github/scripts/ci-timing.mjs finish lint "$phase_exit"; exit "$phase_exit"' EXIT
          ${{ inputs.lint_command }}
      - name: Run test phase
        if: inputs.test_command != ''
        shell: bash
        env:
          E2E_PLATFORM: ${{ inputs.e2e_platform }}
        run: |-
          node .github/scripts/ci-timing.mjs start test
          trap 'phase_exit=$?; node .github/scripts/ci-timing.mjs finish test "$phase_exit"; exit "$phase_exit"' EXIT
          ${{ inputs.test_command }}
      - name: Run contracts phase
        if: inputs.contracts_command != ''
        shell: bash
        env:
          E2E_PLATFORM: ${{ inputs.e2e_platform }}
        run: |-
          node .github/scripts/ci-timing.mjs start contracts
          trap 'phase_exit=$?; node .github/scripts/ci-timing.mjs finish contracts "$phase_exit"; exit "$phase_exit"' EXIT
          ${{ inputs.contracts_command }}
      - name: Run command
        shell: bash
        env:
          E2E_PLATFORM: ${{ inputs.e2e_platform }}
        run: |
          if [[ '${{ inputs.increase_ulimit && runner.os != 'Windows' }}' == 'true' ]]; then
            ulimit -n 65536 || true
            printf 'Effective file descriptor limit: '
            ulimit -n || true
          fi
          node .github/scripts/ci-timing.mjs start main
          trap 'phase_exit=$?; node .github/scripts/ci-timing.mjs finish main "$phase_exit"; exit "$phase_exit"' EXIT
          if [[ -n "$PR_BASE_SHA" ]]; then
            export GITHUB_BASE_REF="$PR_BASE_SHA"
            export GITHUB_HEAD_REF="$PR_HEAD_REF"
          fi
          ${{ inputs.main_command }}
      - name: Resolve floating Node 22 support version
        if: inputs.resolve_node_support
        id: support-latest-22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ^22.23.4
          check-latest: true
      - name: Resolve floating Node 24 support version
        if: inputs.resolve_node_support
        id: support-latest-24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ^24.22.1
          check-latest: true
      - name: Restore the immutable artifact builder Node
        if: inputs.resolve_node_support
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
      - name: Freeze complete Node support roles and unique executions
        if: inputs.resolve_node_support
        id: node-support-plan
        shell: bash
        env:
          SUPPORT_LATEST_22: ${{ steps.support-latest-22.outputs.node-version }}
          SUPPORT_LATEST_24: ${{ steps.support-latest-24.outputs.node-version }}
        run: node scripts/nodeSupport/index.mjs plan .cache/node-support-tarballs/ci-provenance.json .tmp/consumer-plan/node-support.json "$SUPPORT_LATEST_22" "$SUPPORT_LATEST_24"
      - name: Freeze all consumer scenarios into four deterministic batches
        if: inputs.prepare_consumer_batches
        id: consumer-batch-plan
        run: node scripts/consumerBatches/plan.mjs .cache/node-support-tarballs/ci-provenance.json .tmp/consumer-plan/scenarios.json
      - name: Finalize original coverage threshold verdict
        if: success() && inputs.verification_telemetry
        run: node scripts/verificationTelemetry/cli.mjs finalize-coverage --if-present --command-succeeded
      - name: Upload coverage reports to Codecov
        if: inputs.upload_codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          override_commit: ${{ inputs.head_sha || inputs.checkout_ref || github.sha }}
          override_pr: ${{ inputs.pr_number }}
          override_branch: ${{ inputs.head_ref || github.ref_name }}
        env:
          CODECOV_TOKEN: ${{ inputs.pr_number == '' && secrets.CODECOV_TOKEN || '' }}
      - name: Upload artifact
        if: ${{ !cancelled() && inputs.artifact_name != '' && inputs.artifact_path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          include-hidden-files: true
          path: ${{ inputs.artifact_path }}
          if-no-files-found: warn
      - name: Upload workspace build artifact
        if: ${{ success() && inputs.build_artifact_name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.build_artifact_name }}
          include-hidden-files: true
          path: |
            packages/*/dist/**
            packages-runtime/*/dist/**
            packages-private/*/dist/**
            @weapp-core/*/dist/**
            benchmarks/*/dist/**
            mpcore/packages/*/dist/**
            packages/*/bin/**
            packages-runtime/*/bin/**
            packages-private/*/bin/**
            @weapp-core/*/bin/**
            mpcore/packages/*/bin/**
            .tmp/build-artifact-manifest.json
            .tmp/verification-telemetry/plans/**
          if-no-files-found: error
      - name: Upload frozen consumer verification plans
        if: ${{ success() && inputs.plan_artifact_name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: .tmp/consumer-plan
          if-no-files-found: error
      - name: Upload CI stage timings
        if: ${{ !cancelled() && inputs.timing_artifact_name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.timing_artifact_name }}
          path: .tmp/ci-timings.json
          if-no-files-found: error
      - name: Upload baseline coverage plan
        if: success() && inputs.verification_telemetry && contains(inputs.main_command, 'pnpm test:coverage')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-plan-${{ inputs.runs_on }}-node-${{ inputs.node_version }}
          include-hidden-files: true
          path: .tmp/verification-telemetry/coverage/plan.json
          if-no-files-found: error
      - name: Upload baseline native coverage execution
        if: success() && inputs.verification_telemetry && contains(inputs.main_command, 'pnpm test:coverage')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-shard-${{ inputs.runs_on }}-node-${{ inputs.node_version }}-1
          include-hidden-files: true
          path: |
            .tmp/verification-telemetry/coverage/manifest.json
            .tmp/verification-telemetry/coverage/blob.json
          if-no-files-found: error
      - name: Upload baseline original coverage threshold verdict
        if: success() && inputs.verification_telemetry && contains(inputs.main_command, 'pnpm test:coverage')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-complete-${{ inputs.runs_on }}-node-${{ inputs.node_version }}
          include-hidden-files: true
          path: |
            .tmp/verification-telemetry/coverage/shard-verdict.json
            .tmp/verification-telemetry/coverage/logical-scope.json
          if-no-files-found: error
      - name: Upload baseline suite execution evidence
        if: success() && inputs.verification_telemetry && (contains(inputs.main_command, 'e2e:ci:pr') || contains(inputs.main_command, 'e2e:ci:full') || contains(inputs.main_command, 'ide-dom-headless'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-suite-${{ inputs.artifact_name }}
          include-hidden-files: true
          path: .tmp/verification-telemetry/suite/
          if-no-files-found: error
      - name: Save trusted workspace task cache
        if: ${{ success() && inputs.pr_number == '' && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ env.REPOCTL_RELEASE_NODE_VERSION }}-${{ env.REPOCTL_RELEASE_PNPM_VERSION }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ inputs.checkout_ref || github.sha }}
      - name: Save trusted Playwright browser revisions
        if: ${{ success() && inputs.install_playwright && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.playwright-cache.outputs.path }}
          key: ${{ steps.playwright-cache.outputs.key }}
