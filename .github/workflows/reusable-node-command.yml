name: Reusable Node Command

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      node_version:
        required: true
        type: string
      timeout_minutes:
        required: true
        type: number
      fetch_depth:
        required: false
        type: number
        default: 2
      build_command:
        required: false
        type: string
        default: ''
      main_command:
        required: true
        type: string
      e2e_platform:
        required: false
        type: string
        default: ''
      install_playwright:
        required: false
        type: boolean
        default: false
      playwright_browsers:
        required: false
        type: string
        default: chromium
      increase_ulimit:
        required: false
        type: boolean
        default: false
      upload_codecov:
        required: false
        type: boolean
        default: false
      artifact_name:
        required: false
        type: string
        default: ''
      artifact_path:
        required: false
        type: string
        default: ''
      build_artifact_name:
        required: false
        type: string
        default: ''
      consume_build_artifact:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      BUILD_ARTIFACT_EXPECTED_NODE_MAJOR: ${{ startsWith(inputs.node_version, '22') && '22' || '24' }}
      BUILD_ARTIFACT_EXPECTED_COMMIT: ${{ github.sha }}

    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --system core.longpaths true

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node_version }}

      - if: inputs.build_command != '' && inputs.consume_build_artifact == ''
        uses: ./.github/actions/refresh-workspace-deps
        with:
          build-command: ${{ inputs.build_command }}

      - name: Download workspace build artifact
        if: inputs.consume_build_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.consume_build_artifact }}
          path: .

      - name: Refresh workspace links after artifact restore
        if: inputs.consume_build_artifact != ''
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/verify-build-artifact-manifest.mjs

      - name: Create workspace build artifact manifest
        if: inputs.build_artifact_name != ''
        run: node scripts/create-build-artifact-manifest.mjs

      - name: Increase file descriptor limit
        if: inputs.increase_ulimit && runner.os != 'Windows'
        run: ulimit -n 65536 || true

      - name: Install Playwright browsers and system dependencies
        if: inputs.install_playwright && runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\#azure.archive.ubuntu.com#d' /etc/apt/apt-mirrors.txt
          fi
          pnpm exec playwright install --with-deps ${{ inputs.playwright_browsers }}

      - name: Install Playwright browsers
        if: inputs.install_playwright && runner.os != 'Linux'
        run: pnpm exec playwright install ${{ inputs.playwright_browsers }}

      - name: Run command
        env:
          E2E_PLATFORM: ${{ inputs.e2e_platform }}
        run: ${{ inputs.main_command }}

      - name: Upload coverage reports to Codecov
        if: inputs.upload_codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload artifact
        if: ${{ always() && inputs.artifact_name != '' && inputs.artifact_path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: warn

      - name: Upload workspace build artifact
        if: ${{ success() && inputs.build_artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.build_artifact_name }}
          path: |
            packages/*/dist/**
            packages-runtime/*/dist/**
            packages-private/*/dist/**
            @weapp-core/*/dist/**
            benchmarks/*/dist/**
            mpcore/packages/*/dist/**
            packages/*/bin/**
            packages-runtime/*/bin/**
            packages-private/*/bin/**
            @weapp-core/*/bin/**
            mpcore/packages/*/bin/**
            .tmp/build-artifact-manifest.json
          if-no-files-found: error
