name: CI E2E

on:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: '50 1 * * *'
  workflow_dispatch:
    inputs:
      hmr-diagnostic:
        description: 选择 HMR 定向回归；默认保留完整矩阵
        type: choice
        required: false
        default: full
        options:
          - full
          - shared-layout-windows
          - lifecycle
          - runtime-publication
          - native-source-notification

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.hmr-diagnostic || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-source-notification-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'native-source-notification'
    name: Native Notification Diagnostic (Ubuntu / Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: a88e9e260ccc684f4cf3501a38fc919d3a63cc42
    steps:
      - name: Check out the temporary diagnostic driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: driver
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the exact unmodified product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a88e9e260ccc684f4cf3501a38fc919d3a63cc42
          path: candidate
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: Install the candidate dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build the candidate package closure
        working-directory: candidate
        run: pnpm exec turbo run build --filter=weapp-vite...
      - name: Prepare immutable in-memory observation
        working-directory: candidate
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { cp, mkdir, writeFile } from 'node:fs/promises'
          import os from 'node:os'
          const product = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const driver = execFileSync('git', ['rev-parse', 'HEAD'], { cwd: '../driver', encoding: 'utf8' }).trim()
          assert.equal(product, process.env.CANDIDATE_SHA)
          assert.equal(execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim(), '')
          const changed = execFileSync('git', ['diff', '--name-only', product, driver], { cwd: '../driver', encoding: 'utf8' }).trim().split('\n')
          assert(changed.every(file => file === '.github/workflows/ci-e2e.yml' || file.startsWith('scripts/diagnostics/nativeNotification/')))
          await mkdir('.tmp/native-source-notification-probe', { recursive: true })
          await cp('../driver/scripts/diagnostics/nativeNotification', '.tmp/native-source-notification-probe', { recursive: true })
          await writeFile('.tmp/native-source-notification-probe/dispatch.json', JSON.stringify({
            candidate: product, driver, changed, node: process.version, platform: process.platform,
            architecture: process.arch, cpu: os.cpus()[0]?.model, runnerImage: process.env.ImageOS,
            scope: 'diagnostic only; original app-json then native script, two edit/restore cycles each, one serial control/probe pair; no formal performance verdict',
          }, null, 2) + '\n')
          NODE
          node .tmp/native-source-notification-probe/prepare.mjs
          node .tmp/native-source-notification-probe/prepareHarness.mjs
          node .tmp/native-source-notification-probe/selfCheck.mjs
      - name: Observe the same sequence without changing product files
        working-directory: candidate
        env:
          WEAPP_NATIVE_NOTIFICATION_SLOT: '1'
        run: node .tmp/native-source-notification-probe/runPair.mjs
      - name: Analyze available notification boundaries
        if: always()
        working-directory: candidate
        run: |
          node --input-type=module <<'NODE'
          import { readdir } from 'node:fs/promises'
          import { spawnSync } from 'node:child_process'
          const runs = (await readdir('.tmp')).filter(name => name.startsWith('native-source-notification-run-'))
          for (const run of runs) {
            const result = spawnSync(process.execPath, ['.tmp/native-source-notification-probe/analyze.mjs', `.tmp/${run}`], { stdio: 'inherit' })
            if (result.status !== 0) process.exitCode = result.status ?? 1
          }
          NODE
      - name: Preserve every result and failed attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-notification-ubuntu-${{ github.sha }}
          include-hidden-files: true
          path: |
            candidate/.tmp/native-source-notification-run-*/**
            candidate/.tmp/native-source-notification-probe/dispatch.json
            candidate/.tmp/native-source-notification-probe/manifest.json
            candidate/.tmp/native-source-notification-probe/harness-manifest.json
          if-no-files-found: error
          retention-days: 90

  runtime-publication-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'runtime-publication'
    name: Runtime Publication Regression (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=@mpcore/simulator...
      main_command: |
        pnpm vitest run e2e/utils/devBuildCompletion.test.ts
        pnpm exec vitest run --config scripts/vitest.config.mjs scripts/workspace-hmr/statefulArtifactMeasurement.test.ts scripts/workspace-hmr/statefulArtifactMeasurement.deadline.test.ts scripts/workspace-hmr/statefulAuditClient.test.ts scripts/workspace-hmr/statefulAuditUpdate.test.ts
        pnpm exec cross-env WEAPP_VITE_E2E_RUNTIME_PROVIDER=headless WEAPP_VITE_E2E_DOM_ACCEPTANCE=1 pnpm vitest run -c e2e/vitest.e2e.headless.config.ts e2e/ide/issue-1134-native-topology.runtime.test.ts e2e/ide/script-setup-external-src.runtime.test.ts e2e/ide/issue-1015-css-hmr.runtime.test.ts
      e2e_platform: weapp
      artifact_name: runtime-publication-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ github.sha }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  lifecycle-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'lifecycle'
    name: HMR Lifecycle Regression (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=@mpcore/simulator...
      main_command: |
        pnpm vitest run packages/weapp-vite/src/utils/watchDependencies.test.ts packages/weapp-vite/src/runtime/statefulHmr/snapshotInputs.test.ts packages/weapp-vite/src/runtime/statefulHmr/snapshotBuild.integration.test.ts scripts/editSequence/processTree.test.ts scripts/editSequence/processTree.windows.integration.test.ts scripts/editSequence/processObserver.test.ts scripts/editSequence/processObserverClose.test.ts scripts/editSequence/worker.test.ts
        pnpm vitest run -c e2e/vitest.e2e.ci.config.ts e2e/ci/edit-sequence.test.ts --reporter=default --reporter=json --outputFile=.tmp/hmr-lifecycle-report.json
      e2e_platform: weapp
      artifact_name: hmr-lifecycle-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ github.sha }}
      artifact_path: .tmp/hmr-lifecycle-report.json
    secrets: inherit

  shared-layout-windows-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'shared-layout-windows'
    name: Shared Layout HMR Diagnostic (Windows / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: windows-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci:windows
      main_command: pnpm vitest run -c e2e/vitest.e2e.ci.config.ts e2e/ci/hmr-layout-shared-template-wxs.test.ts
      e2e_platform: weapp
    secrets: inherit

  simulator-browser:
    if: ${{ !cancelled() && (needs.miniapp-e2e-build-pr.result == 'success' || needs.miniapp-e2e-build-full.result == 'success') }}
    needs: [miniapp-e2e-build-pr, miniapp-e2e-build-full]
    name: Simulator Browser E2E (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '[22]' || '[22,24]') }}
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 20
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
      install_playwright: true
      main_command: pnpm --filter @mpcore/simulator test:e2e
      artifact_name: simulator-browser-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: docs/reports/simulator-browser/**
    secrets: inherit

  ide-dom-headless:
    if: ${{ !cancelled() && (needs.miniapp-e2e-build-pr.result == 'success' || needs.miniapp-e2e-build-full.result == 'success') }}
    needs: [miniapp-e2e-build-pr, miniapp-e2e-build-full]
    name: IDE DOM Headless (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '[22]' || '[22,24]') }}
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 30
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
      main_command: node --import tsx e2e/scripts/run-e2e-suite.ts ide-dom-headless
      artifact_name: ide-dom-headless-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: |
        docs/reports/dom-acceptance/**
        docs/reports/*-e2e-ide-dom-headless-*-suite-report/**
    secrets: inherit

  shared-compiler-hosts:
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full')
    name: Shared Compiler Hosts (${{ matrix.os }} / Node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '24'
      timeout_minutes: 30
      build_command: pnpm --filter weapp-vite... --filter @mpcore/simulator... build
      main_command: |
        node integrations/shared-hmr-tailwind/prepare.mjs
        node integrations/shared-hmr-tailwind/verify-install.mjs
        node integrations/shared-hmr-tailwind/verify-isolated.mjs
        node integrations/shared-hmr-tailwind/run-taro.mjs --build
        pnpm exec cross-env WEAPP_VITE_E2E_RUNTIME_PROVIDER=headless WEAPP_VITE_E2E_DOM_ACCEPTANCE=1 pnpm vitest run -c e2e/vitest.e2e.headless.config.ts e2e/ide/shared-taro-hmr.runtime.test.ts
      artifact_name: shared-compiler-hosts-${{ matrix.os }}
      artifact_path: |
        docs/reports/dom-acceptance/**
        .tmp/shared-hosts/artifacts.json

  ide-dom-acceptance-internal:
    if: ${{ !cancelled() && (needs.miniapp-e2e-build-pr.result == 'success' || needs.miniapp-e2e-build-full.result == 'success') }}
    needs: [miniapp-e2e-build-pr, miniapp-e2e-build-full]
    name: IDE DOM Acceptance Contracts (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '[22]' || '[22,24]') }}
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 15
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
      main_command: |
        node packages/weapp-vite/bin/weapp-vite.js prepare e2e-apps/github-issues --platform weapp
        node packages/weapp-vite/bin/weapp-vite.js prepare e2e-apps/template-wevu-regression --platform weapp
        node --import tsx scripts/check-e2e-ide-shared-launch.ts
        node --import tsx e2e/scripts/domAcceptanceReport/inventory.ts --write --check
        pnpm vitest run -c e2e/vitest.e2e.internal.config.ts --maxWorkers=1 --no-file-parallelism
      artifact_name: dom-acceptance-inventory-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ github.sha }}
      artifact_path: |
        e2e/dom-acceptance-inventory.json
        e2e/dom-acceptance-inventory.md
    secrets: inherit

  miniapp-platform-build-gate:
    if: github.event_name == 'pull_request'
    name: Miniapp Platform Build Gate (Ubuntu / Node 22)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '22'
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:platform:build
    secrets: inherit

  miniapp-e2e-build-pr:
    if: github.event_name == 'pull_request'
    name: Miniapp Build Artifact (${{ matrix.os }} / Node 22 / weapp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            build-command: pnpm build:pkgs:ci:macos
      max-parallel: 3
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: 40
      build_command: ${{ matrix.build-command }}
      main_command: node -e "console.log('workspace build artifact ready')"
      build_artifact_name: miniapp-${{ matrix.os }}-node-22-weapp-build
    secrets: inherit

  miniapp-e2e-ci-pr:
    if: github.event_name == 'pull_request'
    needs: miniapp-e2e-build-pr
    name: Miniapp E2E PR (${{ matrix.os }} / Node 22 / ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
          - platform: weapp
            os: windows-latest
          - platform: weapp
            os: macos-latest
      max-parallel: 3
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: 40
      main_command: pnpm e2e:ci:pr
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-22-weapp-build
      artifact_name: miniapp-e2e-ci-pr-${{ matrix.os }}-node-22
      artifact_path: docs/reports/*-e2e-ci-pr-*-suite-report/**
    secrets: inherit

  miniapp-hmr-ci-pr:
    if: github.event_name == 'pull_request'
    needs: miniapp-e2e-build-pr
    name: Miniapp HMR Guard (${{ matrix.os }} / Node 22 / weapp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-command: pnpm build:pkgs:ci
            timeout_minutes: 35
      max-parallel: 1
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      main_command: pnpm e2e:hmr:guard:smoke
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-22-weapp-build
    secrets: inherit

  miniapp-e2e-build-full:
    if: github.event_name != 'pull_request' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full')
    name: Miniapp Nightly Build Artifact (${{ matrix.os }} / Node ${{ matrix.node-version }} / weapp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:macos
          - platform: weapp
            os: ubuntu-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:macos
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 40
      build_command: ${{ matrix.build-command }}
      main_command: node -e "console.log('workspace build artifact ready')"
      build_artifact_name: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
    secrets: inherit

  miniapp-e2e-ci-full:
    if: github.event_name != 'pull_request' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full')
    needs: miniapp-e2e-build-full
    name: Miniapp E2E Nightly (${{ matrix.os }} / Node ${{ matrix.node-version }} / shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 40
      main_command: pnpm e2e:ci:full -- --shard-index=${{ matrix.shard }} --shard-total=4
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
      artifact_name: miniapp-e2e-ci-full-${{ matrix.os }}-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}
      artifact_path: docs/reports/*-e2e-ci-full-*-suite-report/**
    secrets: inherit

  miniapp-hmr-ci-full:
    if: github.event_name != 'pull_request' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full')
    needs: miniapp-e2e-build-full
    name: Miniapp HMR Guard (${{ matrix.os }} / Node ${{ matrix.node-version }} / weapp)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci
            timeout_minutes: 35
          - os: windows-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:windows
            timeout_minutes: 50
          - os: macos-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:macos
            timeout_minutes: 35
          - os: ubuntu-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci
            timeout_minutes: 35
          - os: windows-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:windows
            timeout_minutes: 50
          - os: macos-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:macos
            timeout_minutes: 35
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      main_command: pnpm e2e:ci:hmr
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
    secrets: inherit

  web-e2e-baseline-pr:
    if: github.event_name == 'pull_request'
    name: Web E2E Baseline (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      # DevTools baselines are generated on macOS and depend on its system CJK fonts.
      runs_on: macos-latest
      node_version: '24'
      timeout_minutes: 35
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web
      install_playwright: true
      artifact_name: web-runtime-visual-pr
      artifact_path: |
        .tmp/web-runtime-visual/**
        .tmp/uview-plus-compat/web/**
        .tmp/wot-ui-compat/web/**
    secrets: inherit

  web-project-builds:
    if: (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full')
    name: Web Project Builds (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 45
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web:build-projects
    secrets: inherit

  web-browser-smoke:
    if: (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full')
    name: Web Browser Smoke (Firefox / WebKit / Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 45
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web:browser-smoke
      install_playwright: true
      playwright_browsers: firefox webkit
    secrets: inherit

  workspace-hmr-pr:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/pnpm-version')
    name: Workspace HMR Changed Projects (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 60
      fetch_depth: 0
      build_command: pnpm build:pkgs:ci
      main_command: pnpm audit:hmr:changed
      increase_ulimit: true
      artifact_name: workspace-hmr-pr
      artifact_path: .tmp/workspace-hmr/**
    secrets: inherit

  workspace-hmr-nightly:
    if: github.event_name != 'pull_request' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full')
    name: Workspace HMR Nightly Full (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 120
      fetch_depth: 0
      build_command: pnpm build:pkgs:ci
      main_command: pnpm audit:hmr:nightly
      increase_ulimit: true
      artifact_name: workspace-hmr-nightly
      artifact_path: .tmp/workspace-hmr/**
    secrets: inherit

  web-e2e-baseline-full:
    if: github.event_name != 'pull_request' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full')
    name: Web E2E Baseline (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      # Keep screenshot font rasterization aligned with the DevTools baseline host.
      runs_on: macos-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 35
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web
      install_playwright: true
      artifact_name: web-runtime-visual-node-${{ matrix.node-version }}
      artifact_path: |
        .tmp/web-runtime-visual/**
        .tmp/uview-plus-compat/web/**
        .tmp/wot-ui-compat/web/**
    secrets: inherit
