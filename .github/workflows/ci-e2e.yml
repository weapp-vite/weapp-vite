name: CI E2E

on:
  schedule:
    - cron: '50 1 * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR 编号；留空保留当前分支或定时验证
        required: false
        default: ''
        type: string
      exclude-e2e-projects:
        description: 排除的 E2E 专项项目名，逗号分隔；留空运行完整范围
        required: false
        default: ''
        type: string
      hmr-diagnostic:
        description: 选择 HMR 定向回归；默认保留完整矩阵
        type: choice
        required: false
        default: full
        options:
          - full
          - shared-layout-windows
          - lifecycle
          - runtime-publication
          - plugin-watch-readiness
          - workspace-hmr
          - windows-process-narrow
          - windows-dev-cleanup
          - native-compiler-batch
          - bun-cli

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-number || github.ref }}-${{ inputs.hmr-diagnostic || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      profile: ci-e2e
  validation:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    uses: ./.github/workflows/validate-ci-e2e.yml
    with:
      pr_context: ${{ needs.pr-context.outputs.pr_context }}
      hmr-diagnostic: ${{ inputs.hmr-diagnostic || 'full' }}
      exclude-e2e-projects: ${{ inputs.exclude-e2e-projects || '' }}
    secrets: inherit
