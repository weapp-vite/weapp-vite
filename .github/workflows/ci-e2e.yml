name: CI E2E

on:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: '50 1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  miniapp-platform-build-gate:
    if: github.event_name == 'pull_request'
    name: Miniapp Platform Build Gate (Ubuntu / Node 22)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '22'
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:platform:build
    secrets: inherit

  miniapp-e2e-build-pr:
    if: github.event_name == 'pull_request'
    name: Miniapp Build Artifact (${{ matrix.os }} / Node 22 / weapp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            build-command: pnpm build:pkgs:ci:macos
      max-parallel: 3
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: 40
      build_command: ${{ matrix.build-command }}
      main_command: node -e "console.log('workspace build artifact ready')"
      build_artifact_name: miniapp-${{ matrix.os }}-node-22-weapp-build
    secrets: inherit

  miniapp-e2e-ci-pr:
    if: github.event_name == 'pull_request'
    needs: miniapp-e2e-build-pr
    name: Miniapp E2E PR (${{ matrix.os }} / Node 22 / ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
          - platform: weapp
            os: windows-latest
          - platform: weapp
            os: macos-latest
      max-parallel: 3
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: 40
      main_command: pnpm e2e:ci:pr
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-22-weapp-build
    secrets: inherit

  miniapp-hmr-ci-pr:
    if: github.event_name == 'pull_request'
    needs: miniapp-e2e-build-pr
    name: Miniapp HMR Guard (${{ matrix.os }} / Node 22 / weapp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-command: pnpm build:pkgs:ci
            timeout_minutes: 35
      max-parallel: 1
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      main_command: pnpm e2e:hmr:guard:smoke
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-22-weapp-build
    secrets: inherit

  miniapp-e2e-build-full:
    if: github.event_name != 'pull_request'
    name: Miniapp Nightly Build Artifact (${{ matrix.os }} / Node ${{ matrix.node-version }} / weapp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:macos
          - platform: weapp
            os: ubuntu-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:macos
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 40
      build_command: ${{ matrix.build-command }}
      main_command: node -e "console.log('workspace build artifact ready')"
      build_artifact_name: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
    secrets: inherit

  miniapp-e2e-ci-full:
    if: github.event_name != 'pull_request'
    needs: miniapp-e2e-build-full
    name: Miniapp E2E Nightly (${{ matrix.os }} / Node ${{ matrix.node-version }} / shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 40
      main_command: pnpm e2e:ci:full -- --shard-index=${{ matrix.shard }} --shard-total=4
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
    secrets: inherit

  miniapp-hmr-ci-full:
    if: github.event_name != 'pull_request'
    needs: miniapp-e2e-build-full
    name: Miniapp HMR Guard (${{ matrix.os }} / Node ${{ matrix.node-version }} / weapp)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci
            timeout_minutes: 35
          - os: windows-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:windows
            timeout_minutes: 50
          - os: macos-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:macos
            timeout_minutes: 35
          - os: ubuntu-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci
            timeout_minutes: 35
          - os: windows-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:windows
            timeout_minutes: 50
          - os: macos-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:macos
            timeout_minutes: 35
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      main_command: pnpm e2e:ci:hmr
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
    secrets: inherit

  web-e2e-baseline-pr:
    if: github.event_name == 'pull_request'
    name: Web E2E Baseline (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      # DevTools baselines are generated on macOS and depend on its system CJK fonts.
      runs_on: macos-latest
      node_version: '24'
      timeout_minutes: 35
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web
      install_playwright: true
      artifact_name: web-runtime-visual-pr
      artifact_path: |
        .tmp/web-runtime-visual/**
        .tmp/uview-plus-compat/web/**
        .tmp/wot-ui-compat/web/**
    secrets: inherit

  web-project-builds:
    name: Web Project Builds (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 45
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web:build-projects
    secrets: inherit

  web-browser-smoke:
    name: Web Browser Smoke (Firefox / WebKit / Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 45
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web:browser-smoke
      install_playwright: true
      playwright_browsers: firefox webkit
    secrets: inherit

  workspace-hmr-pr:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/pnpm-version')
    name: Workspace HMR Changed Projects (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 60
      fetch_depth: 0
      build_command: pnpm build:pkgs:ci
      main_command: pnpm audit:hmr:changed
      increase_ulimit: true
      artifact_name: workspace-hmr-pr
      artifact_path: .tmp/workspace-hmr/**
    secrets: inherit

  workspace-hmr-nightly:
    if: github.event_name != 'pull_request'
    name: Workspace HMR Nightly Full (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 120
      fetch_depth: 0
      build_command: pnpm build:pkgs:ci
      main_command: pnpm audit:hmr:nightly
      increase_ulimit: true
      artifact_name: workspace-hmr-nightly
      artifact_path: .tmp/workspace-hmr/**
    secrets: inherit

  web-e2e-baseline-full:
    if: github.event_name != 'pull_request'
    name: Web E2E Baseline (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      # Keep screenshot font rasterization aligned with the DevTools baseline host.
      runs_on: macos-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 35
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:web
      install_playwright: true
      artifact_name: web-runtime-visual-node-${{ matrix.node-version }}
      artifact_path: |
        .tmp/web-runtime-visual/**
        .tmp/uview-plus-compat/web/**
        .tmp/wot-ui-compat/web/**
    secrets: inherit
