name: CI E2E

on:
  schedule:
    - cron: '50 1 * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR 编号；留空保留当前分支或定时验证
        required: false
        default: ''
        type: string
      hmr-diagnostic:
        description: 选择 HMR 定向回归；默认保留完整矩阵
        type: choice
        required: false
        default: full
        options:
          - full
          - shared-layout-windows
          - lifecycle
          - runtime-publication
          - plugin-watch-readiness
          - workspace-hmr
          - windows-process-narrow
          - windows-dev-cleanup
          - native-compiler-batch

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-number || github.ref }}-${{ inputs.hmr-diagnostic || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    with:
      pr_number: ${{ inputs.pr-number || '' }}

  native-compiler-batch-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'native-compiler-batch')
    name: Native Compiler Batch Diagnostic (${{ matrix.os }} / Node 24)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '24'
      timeout_minutes: 20
      build_command: pnpm exec turbo run build --filter=weapp-vite...
      main_command: pnpm vitest run packages/weapp-vite/src/runtime/statefulHmr/compilerBatch.native.test.ts --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile=.tmp/native-compiler-batch-report.json
      artifact_name: native-compiler-batch-${{ matrix.os }}-node-24-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .tmp/native-compiler-batch-report.json
    secrets: inherit

  windows-dev-cleanup-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'windows-dev-cleanup')
    name: Dev Process Cleanup Shard Diagnostic (Windows / Node ${{ matrix.node-version }} / shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            shard: 3
          - node-version: 22
            shard: 1
          - node-version: 24
            shard: 1
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: windows-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 40
      build_command: pnpm build:ci:windows
      main_command: pnpm exec cross-env WEAPP_VITE_E2E_CLEANUP_TRACE=1 pnpm e2e:ci:full -- --shard-index=${{ matrix.shard }} --shard-total=4
      e2e_platform: weapp
      artifact_name: windows-dev-cleanup-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: docs/reports/*-e2e-ci-full-*-suite-report/**
    secrets: inherit

  windows-process-narrow-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'windows-process-narrow')
    name: Suite Runner Process Diagnostic (Windows / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: windows-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 15
      build_command: pnpm exec turbo run build --filter=weapp-ide-cli...
      main_command: pnpm exec cross-env NODE_DEBUG=weapp-ide-journal-writer pnpm vitest run -c e2e/vitest.e2e.internal.config.ts e2e/scripts/suiteRunner/process.test.ts --maxWorkers=1 --no-file-parallelism --reporter=default --reporter=json --outputFile=.tmp/windows-process-narrow-report.json
      artifact_name: windows-process-narrow-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .tmp/windows-process-narrow-report.json
    secrets: inherit

  plugin-watch-readiness-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'plugin-watch-readiness')
    name: Plugin Watch Readiness (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 20
      build_command: pnpm exec turbo run build --filter=weapp-vite...
      main_command: pnpm vitest run packages/weapp-vite/test/vite-plugin-project.test.ts --reporter=default --reporter=json --outputFile=.tmp/plugin-watch-readiness-report.json
      artifact_name: plugin-watch-readiness-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .tmp/plugin-watch-readiness-report.json
    secrets: inherit

  runtime-publication-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'runtime-publication')
    name: Runtime Publication Regression (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=@mpcore/simulator...
      main_command: |
        pnpm vitest run e2e/utils/devBuildCompletion.test.ts e2e/utils/hmrOutputDiagnostics.test.ts e2e/scripts/e2e-suite-manifest.test.ts e2e/scripts/hmr-guard-manifest.test.ts
        pnpm exec vitest run --config scripts/vitest.config.mjs scripts/workspace-hmr/statefulArtifactMeasurement.test.ts scripts/workspace-hmr/statefulArtifactMeasurement.deadline.test.ts scripts/workspace-hmr/statefulAuditClient.test.ts scripts/workspace-hmr/statefulAuditUpdate.test.ts scripts/e2e-diagnostic-workflow.test.ts scripts/repoctl-release-workflow.test.ts scripts/utils/atomicRename.test.ts scripts/editSequence/buildSources.test.ts scripts/editSequence/frameworkSources.test.ts
        pnpm vitest run -c e2e/vitest.e2e.ci.config.ts e2e/ci/auto-import-vue-sfc.test.ts e2e/ci/external-linked-vue-component.hmr.test.ts
        pnpm exec cross-env WEAPP_VITE_E2E_RUNTIME_PROVIDER=headless WEAPP_VITE_E2E_DOM_ACCEPTANCE=1 pnpm vitest run -c e2e/vitest.e2e.headless.config.ts e2e/ide/issue-1134-native-topology.runtime.test.ts e2e/ide/script-setup-external-src.runtime.test.ts e2e/ide/issue-1015-css-hmr.runtime.test.ts e2e/ide/issue-1140-mode-cache.runtime.test.ts e2e/ide/issue-1058-template-tags.runtime.test.ts
      e2e_platform: weapp
      artifact_name: runtime-publication-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: docs/reports/dom-acceptance/**
    secrets: inherit

  lifecycle-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'lifecycle')
    name: HMR Lifecycle Regression (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 30
      build_command: pnpm exec turbo run build --filter=weapp-vite... --filter=@mpcore/simulator...
      main_command: |
        pnpm vitest run packages/weapp-vite/src/utils/watchDependencies.test.ts packages/weapp-vite/src/runtime/statefulHmr/snapshotInputs.test.ts packages/weapp-vite/src/runtime/statefulHmr/snapshotBuild.integration.test.ts scripts/editSequence/processTree.test.ts scripts/editSequence/processTree.windows.integration.test.ts scripts/editSequence/processObserver.test.ts scripts/editSequence/processObserverClose.test.ts scripts/editSequence/worker.test.ts scripts/utils/atomicRename.test.ts scripts/editSequence/buildSources.test.ts scripts/editSequence/frameworkSources.test.ts
        pnpm vitest run -c e2e/vitest.e2e.ci.config.ts e2e/ci/edit-sequence.test.ts --reporter=default --reporter=json --outputFile=.tmp/hmr-lifecycle-report.json
      e2e_platform: weapp
      artifact_name: hmr-lifecycle-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: .tmp/hmr-lifecycle-report.json
    secrets: inherit

  shared-layout-windows-diagnostic:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' && inputs.hmr-diagnostic == 'shared-layout-windows')
    name: Shared Layout HMR Diagnostic (Windows / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: windows-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci:windows
      main_command: pnpm vitest run -c e2e/vitest.e2e.ci.config.ts e2e/ci/hmr-layout-shared-template-wxs.test.ts
      e2e_platform: weapp
    secrets: inherit

  simulator-browser:
    if: ${{ needs.pr-context.outputs.should_run == 'true' && !cancelled() && (needs.miniapp-e2e-build-pr.result == 'success' || needs.miniapp-e2e-build-full.result == 'success') }}
    needs: [pr-context, miniapp-e2e-build-pr, miniapp-e2e-build-full]
    name: Simulator Browser E2E (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ${{ fromJSON(needs.pr-context.outputs.is_pr == 'true' && '[22]' || '[22,24]') }}
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 20
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
      install_playwright: true
      main_command: pnpm --filter @mpcore/simulator test:e2e
      artifact_name: simulator-browser-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: docs/reports/simulator-browser/**
    secrets: inherit

  ide-dom-headless:
    if: ${{ needs.pr-context.outputs.should_run == 'true' && !cancelled() && (needs.miniapp-e2e-build-pr.result == 'success' || needs.miniapp-e2e-build-full.result == 'success') }}
    needs: [pr-context, miniapp-e2e-build-pr, miniapp-e2e-build-full]
    name: IDE DOM Headless (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ${{ fromJSON(needs.pr-context.outputs.is_pr == 'true' && '[22]' || '[22,24]') }}
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 30
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
      main_command: |
        pnpm vitest run -c e2e/vitest.e2e.utils.config.ts e2e/utils/devProcessCleanup/windowsKernelQuery.test.ts e2e/utils/devProcessCleanup/processes.test.ts e2e/utils/dev-process.cleanup.test.ts e2e/utils/devProcessCleanup/windowsProcessTree.test.ts e2e/utils/devProcessCleanup/windowsProcessRows.test.ts e2e/utils/devProcessCleanup/windowsQueryTrace.test.ts
        pnpm exec cross-env WEAPP_VITE_E2E_CLEANUP_TRACE=1 node --import tsx e2e/scripts/run-e2e-suite.ts ide-dom-headless
      artifact_name: ide-dom-headless-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: |
        docs/reports/dom-acceptance/**
        docs/reports/*-e2e-ide-dom-headless-*-suite-report/**
    secrets: inherit

  shared-compiler-hosts:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && ((needs.pr-context.outputs.is_pr == 'true' || github.event_name == 'workflow_dispatch') && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Shared Compiler Hosts (${{ matrix.os }} / Node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '24'
      timeout_minutes: 30
      build_command: pnpm --filter weapp-vite... --filter @mpcore/simulator... build
      main_command: |
        node integrations/shared-hmr-tailwind/prepare.mjs
        node integrations/shared-hmr-tailwind/verify-install.mjs
        node integrations/shared-hmr-tailwind/verify-isolated.mjs
        node integrations/shared-hmr-tailwind/run-taro.mjs --build
        pnpm exec cross-env WEAPP_VITE_E2E_RUNTIME_PROVIDER=headless WEAPP_VITE_E2E_DOM_ACCEPTANCE=1 pnpm vitest run -c e2e/vitest.e2e.headless.config.ts e2e/ide/shared-taro-hmr.runtime.test.ts
      artifact_name: shared-compiler-hosts-${{ matrix.os }}
      artifact_path: |
        docs/reports/dom-acceptance/**
        .tmp/shared-hosts/artifacts.json

  ide-dom-acceptance-internal:
    if: ${{ needs.pr-context.outputs.should_run == 'true' && !cancelled() && (needs.miniapp-e2e-build-pr.result == 'success' || needs.miniapp-e2e-build-full.result == 'success') }}
    needs: [pr-context, miniapp-e2e-build-pr, miniapp-e2e-build-full]
    name: IDE DOM Acceptance Contracts (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ${{ fromJSON(needs.pr-context.outputs.is_pr == 'true' && '[22]' || '[22,24]') }}
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 15
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
      main_command: |
        node packages/weapp-vite/bin/weapp-vite.js prepare e2e-apps/github-issues --platform weapp
        node packages/weapp-vite/bin/weapp-vite.js prepare e2e-apps/template-wevu-regression --platform weapp
        node --import tsx scripts/check-e2e-ide-shared-launch.ts
        node --import tsx e2e/scripts/domAcceptanceReport/inventory.ts --write --check
        pnpm vitest run -c e2e/vitest.e2e.internal.config.ts --maxWorkers=1 --no-file-parallelism
      artifact_name: dom-acceptance-inventory-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ needs.pr-context.outputs.checkout_sha }}
      artifact_path: |
        e2e/dom-acceptance-inventory.json
        e2e/dom-acceptance-inventory.md
    secrets: inherit

  miniapp-platform-build-gate:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Miniapp Platform Build Gate (Ubuntu / Node 22)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: '22'
      timeout_minutes: 30
      build_command: pnpm build:pkgs:ci
      main_command: pnpm e2e:platform:build
    secrets: inherit

  miniapp-e2e-build-pr:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Miniapp Build Artifact (${{ matrix.os }} / Node 22 / weapp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            build-command: pnpm build:pkgs:ci:macos
      max-parallel: 3
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: 40
      build_command: ${{ matrix.build-command }}
      main_command: node -e "console.log('workspace build artifact ready')"
      build_artifact_name: miniapp-${{ matrix.os }}-node-22-weapp-build
    secrets: inherit

  miniapp-e2e-ci-pr:
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    needs: [pr-context, miniapp-e2e-build-pr]
    name: Miniapp E2E PR (${{ matrix.os }} / Node 22 / ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
          - platform: weapp
            os: windows-latest
          - platform: weapp
            os: macos-latest
      max-parallel: 3
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: 40
      main_command: ${{ matrix.os == 'windows-latest' && 'pnpm exec cross-env WEAPP_VITE_E2E_CLEANUP_TRACE=1 pnpm e2e:ci:pr' || 'pnpm e2e:ci:pr' }}
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-22-weapp-build
      artifact_name: miniapp-e2e-ci-pr-${{ matrix.os }}-node-22
      artifact_path: docs/reports/*-e2e-ci-pr-*-suite-report/**
    secrets: inherit

  miniapp-hmr-ci-pr:
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    needs: [pr-context, miniapp-e2e-build-pr]
    name: Miniapp HMR Guard (${{ matrix.os }} / Node 22 / weapp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build-command: pnpm build:pkgs:ci
            timeout_minutes: 35
      max-parallel: 1
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      main_command: pnpm e2e:hmr:guard:smoke
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-22-weapp-build
    secrets: inherit

  miniapp-e2e-build-full:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    name: Miniapp Nightly Build Artifact (${{ matrix.os }} / Node ${{ matrix.node-version }} / weapp)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: weapp
            os: ubuntu-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci:macos
          - platform: weapp
            os: ubuntu-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci
          - platform: weapp
            os: windows-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:windows
          - platform: weapp
            os: macos-latest
            node-version: 24
            build-command: pnpm build:pkgs:ci:macos
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 40
      build_command: ${{ matrix.build-command }}
      main_command: node -e "console.log('workspace build artifact ready')"
      build_artifact_name: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
    secrets: inherit

  miniapp-e2e-ci-full:
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    needs: [pr-context, miniapp-e2e-build-full]
    name: Miniapp E2E Nightly (${{ matrix.os }} / Node ${{ matrix.node-version }} / shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 40
      main_command: pnpm e2e:ci:full -- --shard-index=${{ matrix.shard }} --shard-total=4
      e2e_platform: weapp
      increase_ulimit: true
      consume_build_artifact: miniapp-${{ matrix.os }}-node-${{ matrix.node-version }}-weapp-build
      artifact_name: miniapp-e2e-ci-full-${{ matrix.os }}-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}
      artifact_path: docs/reports/*-e2e-ci-full-*-suite-report/**
    secrets: inherit

  miniapp-hmr-ci-full:
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true' && (!inputs.hmr-diagnostic || inputs.hmr-diagnostic == 'full'))
    needs: [pr-context, miniapp-e2e-build-full]
    name: Miniapp HMR Guard (${{ matrix.os }} / Node ${{ matrix.node-version }} / weapp)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            build-command: pnpm build:pkgs:ci
