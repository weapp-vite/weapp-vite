name: Performance Smoke

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Optional open PR number; empty skips PR-only smoke
        type: string
        required: false
        default: ''

concurrency:
  group: performance-smoke-${{ inputs.pr-number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      checkout_mode: head

  smoke:
    needs: pr-context
    if: needs.pr-context.outputs.is_pr == 'true' && needs.pr-context.outputs.should_run == 'true'
    name: Performance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.pr-context.outputs.head_repository }}
          ref: ${{ needs.pr-context.outputs.head_sha }}
          persist-credentials: false
      - name: Check out trusted scope driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .tmp/pr-driver
          ref: ${{ github.sha }}
          sparse-checkout: scripts/performanceGate
          persist-credentials: false
      - name: Select relevant paths
        id: scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFORMANCE_PR_NUMBER: ${{ needs.pr-context.outputs.pr_number }}
          PERFORMANCE_HEAD_SHA: ${{ needs.pr-context.outputs.head_sha }}
          PERFORMANCE_BASE_SHA: ${{ needs.pr-context.outputs.base_sha }}
        run: node .tmp/pr-driver/scripts/performanceGate/smokeScope.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.needed == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.needed == 'true'
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check collector contracts
        if: steps.scope.outputs.needed == 'true'
        run: pnpm exec vitest run --config scripts/vitest.config.mjs scripts/performanceGate scripts/benchmarkTemplatesHmr scripts/benchmarkTemplatesPerformance/measuredBuild.test.ts scripts/performance-comment-workflow.test.ts
      - name: Run correctness smoke
        if: steps.scope.outputs.needed == 'true'
        env:
          PERFORMANCE_PURPOSE: smoke
          PERFORMANCE_PR_NUMBER: ${{ needs.pr-context.outputs.pr_number }}
          PERFORMANCE_HEAD_SHA: ${{ needs.pr-context.outputs.head_sha }}
          TEMPLATES_PERF_OPTIMIZED_DIR: ${{ github.workspace }}
          TEMPLATES_PERF_REPORT_DIR: ${{ runner.temp }}/performance-smoke
        run: pnpm exec tsx scripts/performanceGate/smoke.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scope.outputs.needed == 'true'
        with:
          name: performance-smoke-report
          path: ${{ runner.temp }}/performance-smoke
          if-no-files-found: warn
