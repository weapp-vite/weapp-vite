name: Performance Smoke

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Optional open PR number; empty skips PR-only smoke
        type: string
        required: false
        default: ''

concurrency:
  group: performance-smoke-${{ inputs.pr-number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      profile: ci-performance
  validation:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    uses: ./.github/workflows/validate-ci-performance.yml
    with:
      pr_context: ${{ needs.pr-context.outputs.pr_context }}
    secrets: inherit
