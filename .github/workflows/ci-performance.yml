name: Performance Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: performance-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  smoke:
    name: Performance Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select relevant paths
        id: scope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/performanceGate/smokeScope.mjs
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        if: steps.scope.outputs.needed == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.needed == 'true'
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Check collector contracts
        if: steps.scope.outputs.needed == 'true'
        run: pnpm exec vitest run --config scripts/vitest.config.mjs scripts/performanceGate scripts/benchmarkTemplatesHmr scripts/benchmarkTemplatesPerformance/measuredBuild.test.ts scripts/performance-comment-workflow.test.ts
      - name: Run correctness smoke
        if: steps.scope.outputs.needed == 'true'
        env:
          PERFORMANCE_PURPOSE: smoke
          PERFORMANCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          PERFORMANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEMPLATES_PERF_OPTIMIZED_DIR: ${{ github.workspace }}
          TEMPLATES_PERF_REPORT_DIR: ${{ runner.temp }}/performance-smoke
        run: pnpm exec tsx scripts/performanceGate/smoke.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.scope.outputs.needed == 'true'
        with:
          name: performance-smoke-report
          path: ${{ runner.temp }}/performance-smoke
          if-no-files-found: warn
