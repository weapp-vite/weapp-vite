name: Automatic Release Intent

on:
  workflow_dispatch:
    inputs:
      pullRequest:
        description: Same-repository pull request number
        required: true
        type: number

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: repoctl-auto-changeset-${{ inputs.pullRequest }}
  cancel-in-progress: true

env:
  REPOCTL_POLICY_PATH: .github/repoctl-auto-changeset.json
  REPOCTL_WORKFLOW_PATH: .github/workflows/release-intent-auto.yml
  REPOCTL_ENVIRONMENT: pr-ci-approval
  REPOCTL_PLAN_JOB: Plan automatic changeset
  REPOCTL_APPLY_JOB: Apply automatic changeset

jobs:
  plan:
    name: Plan automatic changeset
    environment: pr-ci-approval
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install trusted repoctl
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/repoctl-tools" --ignore-scripts --no-audit --no-fund --package-lock=false repoctl@6.3.1
      - id: plan
        name: Freeze proposal from GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pullRequest }}
        working-directory: ${{ runner.temp }}
        run: |
          GITHUB_TOKEN="$GH_TOKEN" "$RUNNER_TEMP/repoctl-tools/node_modules/.bin/repoctl" release auto-changeset --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --policy-path "$REPOCTL_POLICY_PATH" --out "$RUNNER_TEMP/auto-changeset-plan.json"
          echo "changed=$(jq 'has("change")' "$RUNNER_TEMP/auto-changeset-plan.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: auto-changeset-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auto-changeset-plan.json
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply automatic changeset
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    environment: pr-ci-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install trusted repoctl
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/repoctl-tools" --ignore-scripts --no-audit --no-fund --package-lock=false repoctl@6.3.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact-id }}
          path: ${{ runner.temp }}/auto-changeset-plan
          merge-multiple: true
      - name: Recheck approval and append the changeset commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pullRequest }}
        working-directory: ${{ runner.temp }}
        run: |
          GITHUB_TOKEN="$GH_TOKEN" "$RUNNER_TEMP/repoctl-tools/node_modules/.bin/repoctl" release auto-changeset --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --policy-path "$REPOCTL_POLICY_PATH" --apply --expected "$RUNNER_TEMP/auto-changeset-plan/auto-changeset-plan.json" --environment "$REPOCTL_ENVIRONMENT" --workflow-path "$REPOCTL_WORKFLOW_PATH" --plan-job-name "$REPOCTL_PLAN_JOB" --apply-job-name "$REPOCTL_APPLY_JOB" --json
