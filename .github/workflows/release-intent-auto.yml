name: Automatic Release Intent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled, closed]
    branches: [main, alpha, beta, rc, next]

permissions:
  contents: read

concurrency:
  group: release-intent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate approved release intent
    if: ${{ github.event.action != 'closed' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pr-ci-approval
    permissions:
      contents: write
      pull-requests: write
    env:
      LEFTHOOK: '0'
    steps:
      - name: Check out trusted default branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Setup declared pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install trusted tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate changeset from frozen PR data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx .github/auto-changeset/index.mjs
