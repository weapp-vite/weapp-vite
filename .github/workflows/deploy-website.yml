name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to validate (empty uses the selected ref)
        required: false
        default: ''
        type: string

concurrency:
  group: website-${{ inputs.pr-number != '' && format('pr-{0}', inputs.pr-number) || (github.ref == 'refs/heads/main' && 'production' || github.ref) }}
  cancel-in-progress: ${{ inputs.pr-number != '' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      profile: deploy-website
  validation:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    uses: ./.github/workflows/validate-deploy-website.yml
    with:
      pr_context: ${{ needs.pr-context.outputs.pr_context }}
    secrets: inherit
