# repoctl-managed: docs-deploy/v1
name: Deploy documentation

on:
  workflow_call:
    inputs:
      site:
        required: true
        type: string
      channel:
        required: true
        type: string
      source-sha:
        required: false
        default: ''
        type: string
      release:
        required: false
        default: ''
        type: string
      commits:
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  LEFTHOOK: '0'

concurrency:
  group: docs-${{ inputs.site }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: docs-${{ inputs.site }}-${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Plan and deploy the selected documentation source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_DOCS_SITE: ${{ inputs.site }}
          REPO_DOCS_CHANNEL: ${{ inputs.channel }}
          REPO_DOCS_SOURCE_SHA: ${{ inputs.source-sha }}
          REPO_DOCS_RELEASE: ${{ inputs.release }}
          REPO_DOCS_COMMITS: ${{ inputs.commits }}
          REPO_DOCS_CONCURRENCY_GROUP: docs-${{ inputs.site }}-${{ inputs.channel }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          args=("$REPO_DOCS_SITE" --channel "$REPO_DOCS_CHANNEL")
          if [ -n "$REPO_DOCS_SOURCE_SHA" ]; then args+=(--source-sha "$REPO_DOCS_SOURCE_SHA"); fi
          if [ -n "$REPO_DOCS_RELEASE" ]; then args+=(--release "$REPO_DOCS_RELEASE"); fi
          if [ -n "$REPO_DOCS_COMMITS" ]; then
            read -r -a commits <<< "$REPO_DOCS_COMMITS"
            args+=(--commits "${commits[@]}")
          fi
          pnpm exec repo docs plan "${args[@]}" --json
          pnpm exec repo docs deploy "${args[@]}" --json
