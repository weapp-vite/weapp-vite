name: Windows Process Identity Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-writer-check:
    name: Journal writer first query (Windows / Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Enable Git long paths
        shell: bash
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}

      - uses: ./.github/actions/refresh-workspace-deps
        with:
          build-command: pnpm exec turbo run build --filter=weapp-ide-cli...

      - name: Verify first production writer query and exact legacy identity
        shell: bash
        run: node --import tsx scripts/windowsProcessIdentityProbe/checkSelfWriter.ts

      - name: Verify writer and journal ownership contracts
        shell: bash
        run: pnpm --filter weapp-ide-cli exec vitest run src/devtoolsProjectOwnership

      - name: Prepare E2E bridge dependencies
        shell: bash
        run: pnpm exec turbo run build --filter=weapp-vite... --filter=@mpcore/simulator...

      - name: Verify isolated E2E journal and bridge contracts
        shell: bash
        run: |
          pnpm vitest run -c e2e/vitest.e2e.utils.config.ts e2e/utils/devtoolsProcessOwnership.scope.test.ts e2e/utils/machineGlobalSetup.test.ts
          pnpm vitest run -c e2e/vitest.e2e.ci.config.ts e2e/ci/automator-launch-resilience.test.ts

      - name: Upload writer query evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-journal-self-writer-node-${{ matrix.node }}-${{ github.sha }}
          path: .tmp/windows-journal-self-writer/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  identity-probe:
    name: Diagnostic only (Windows / Node ${{ matrix.node }} / ${{ matrix.firstProvider }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        firstProvider: [cim, candidate]
    steps:
      - name: Enable Git long paths
        shell: bash
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}

      - uses: ./.github/actions/refresh-workspace-deps
        with:
          build-command: pnpm exec turbo run build --filter=weapp-ide-cli...

      - name: Collect bounded identity diagnostics without launching DevTools
        shell: bash
        env:
          WEAPP_IDENTITY_PROBE_FIRST_PROVIDER: ${{ matrix.firstProvider }}
        run: node --import tsx scripts/windowsProcessIdentityProbe/index.ts

      - name: Upload diagnostic evidence (not runtime acceptance)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-process-identity-node-${{ matrix.node }}-${{ matrix.firstProvider }}-first-${{ github.sha }}
          path: .tmp/windows-process-identity-probe/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
