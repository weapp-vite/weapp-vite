name: Windows Process Identity Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-probe:
    name: Diagnostic only (Windows / Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Enable Git long paths
        shell: bash
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}

      - uses: ./.github/actions/refresh-workspace-deps
        with:
          build-command: pnpm exec turbo run build --filter=weapp-ide-cli...

      - name: Collect bounded identity diagnostics without launching DevTools
        shell: bash
        run: node --import tsx scripts/windowsProcessIdentityProbe/index.ts

      - name: Upload diagnostic evidence (not runtime acceptance)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-process-identity-node-${{ matrix.node }}-${{ github.sha }}
          path: .tmp/windows-process-identity-probe/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
