name: CI

on:
  # push:
  #   branches: ['main']
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR 编号；留空保留当前分支或定时验证
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}

  build-pr:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && !startsWith(needs.pr-context.outputs.head_ref, 'release/pnpm-version'))
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
            main_command: |
              pnpm lint
              pnpm build:ci
              pnpm test:coverage
              pnpm test:dependency-contracts
          - os: ubuntu-latest
            node-version: 24
            timeout_minutes: 25
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
            main_command: |
              pnpm build:pkgs:ci
              pnpm test:types
              pnpm test:dependency-contracts
          - os: windows-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:windows
            build_script: build:ci:windows
            lint_script: lint:ci:windows
            main_command: |
              pnpm build:ci:windows
              pnpm test:dependency-contracts
          - os: macos-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:macos
            build_script: build:ci:macos
            lint_script: lint
            main_command: |
              pnpm build:ci:macos
              pnpm test:dependency-contracts
      max-parallel: 4
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      # Each PR command owns its single build stage; avoid a second package build in setup.
      build_command: ''
      main_command: ${{ matrix.main_command }}
      artifact_name: dependency-contracts-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: .tmp/dependency-contracts
      upload_codecov: true
    secrets: inherit

  build-release-pr:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && startsWith(needs.pr-context.outputs.head_ref, 'release/pnpm-version'))
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            timeout_minutes: 40
            build_script: build:ci
            lint_script: lint
          - os: ubuntu-latest
            node-version: 24
            timeout_minutes: 40
            build_script: build:ci
            lint_script: lint
      max-parallel: 2
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      # The full build below owns package artifacts; do not build them again during setup.
      build_command: ''
      main_command: |
        pnpm ${{ matrix.lint_script }}
        pnpm ${{ matrix.build_script }}
        pnpm test:dependency-contracts
        pnpm test:coverage
      artifact_name: dependency-contracts-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: .tmp/dependency-contracts
      upload_codecov: true
    secrets: inherit

  build-full:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true')
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
          - os: ubuntu-latest
            node-version: 24
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
          - os: windows-latest
            node-version: 22
            # Windows 安装与串行 lint/build 约 25 分钟，coverage 还需 35 分钟以上；总预算包含收尾。
            timeout_minutes: 90
            build_pkgs_script: build:pkgs:ci:windows
            build_script: build:ci:windows
            lint_script: lint:ci:windows
          - os: windows-latest
            node-version: 24
            timeout_minutes: 90
            build_pkgs_script: build:pkgs:ci:windows
            build_script: build:ci:windows
            lint_script: lint:ci:windows
          # 完整质量命令之外还包含依赖安装及 pnpm 缓存压缩上传，job 预算需覆盖收尾。
          - os: macos-latest
            node-version: 22
            timeout_minutes: 60
            build_pkgs_script: build:pkgs:ci:macos
            build_script: build:ci:macos
            lint_script: lint
          - os: macos-latest
            node-version: 24
            timeout_minutes: 60
            build_pkgs_script: build:pkgs:ci:macos
            build_script: build:ci:macos
            lint_script: lint
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      build_command: pnpm ${{ matrix.build_pkgs_script }}
      main_command: |
        pnpm ${{ matrix.lint_script }}
        pnpm ${{ matrix.build_script }}
        pnpm test:dependency-contracts
        pnpm test:coverage
      artifact_name: dependency-contracts-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: .tmp/dependency-contracts
      upload_codecov: true
    secrets: inherit

  weapi-compat-pr:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true')
    name: Weapi Compatibility Guard (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 15
      main_command: |
        pnpm --filter @weapp-core/api catalog:check
        pnpm --filter @weapp-core/api docs:check
        pnpm --filter @weapp-core/api lint
        pnpm --filter @weapp-core/api typecheck
        pnpm --filter @weapp-core/api typecheck:test
        pnpm --filter @weapp-core/api structure:check
        pnpm --filter @weapp-core/api strict-alias:check
        pnpm --filter @weapp-core/api coverage:check
        pnpm --filter @weapp-core/api test
        pnpm --filter @weapp-core/api test:types
        pnpm --filter @weapp-core/api report:api
        pnpm --filter @wevu/api lint
        pnpm --filter @wevu/api typecheck
        pnpm --filter @wevu/api typecheck:test
        pnpm --filter @wevu/api test
        pnpm --filter @wevu/api test:types
        git diff --exit-code -- \
          @weapp-core/api/README.md \
          @weapp-core/api/src/core/apiCatalog.ts \
          @weapp-core/api/src/core/types.ts \
          @weapp-core/api/src/index.ts \
          @weapp-core/api/types/index.d.ts \
          @weapp-core/api/reports/api-compat \
          packages-runtime/weapi/types/index.d.ts
    secrets: inherit

  weapi-compat-full:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true')
    name: Weapi Compatibility Guard (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 15
      main_command: |
        pnpm --filter @weapp-core/api catalog:check
        pnpm --filter @weapp-core/api docs:check
        pnpm --filter @weapp-core/api lint
        pnpm --filter @weapp-core/api typecheck
        pnpm --filter @weapp-core/api typecheck:test
        pnpm --filter @weapp-core/api structure:check
        pnpm --filter @weapp-core/api strict-alias:check
        pnpm --filter @weapp-core/api coverage:check
        pnpm --filter @weapp-core/api test
        pnpm --filter @weapp-core/api test:types
        pnpm --filter @weapp-core/api report:api
        pnpm --filter @wevu/api lint
        pnpm --filter @wevu/api typecheck
        pnpm --filter @wevu/api typecheck:test
        pnpm --filter @wevu/api test
        pnpm --filter @wevu/api test:types
        git diff --exit-code -- \
          @weapp-core/api/README.md \
          @weapp-core/api/src/core/apiCatalog.ts \
          @weapp-core/api/src/core/types.ts \
          @weapp-core/api/src/index.ts \
          @weapp-core/api/types/index.d.ts \
          @weapp-core/api/reports/api-compat \
          packages-runtime/weapi/types/index.d.ts
    secrets: inherit
