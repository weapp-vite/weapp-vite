name: CI

on:
  # push:
  #   branches: ['main']
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-pr:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/pnpm-version')
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            timeout_minutes: 25
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
            main_command: |
              pnpm lint
              pnpm build:ci
              pnpm test:coverage
          - os: ubuntu-latest
            node-version: 24
            timeout_minutes: 25
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
            main_command: |
              pnpm build:pkgs:ci
              pnpm test:types
          - os: windows-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:windows
            build_script: build:ci:windows
            lint_script: lint:ci:windows
            main_command: pnpm build:ci:windows
          - os: macos-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:macos
            build_script: build:ci:macos
            lint_script: lint
            main_command: pnpm build:ci:macos
      max-parallel: 4
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      # Each PR command owns its single build stage; avoid a second package build in setup.
      build_command: ''
      main_command: ${{ matrix.main_command }}
      upload_codecov: true
    secrets: inherit

  build-release-pr:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/pnpm-version')
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            timeout_minutes: 25
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
          - os: ubuntu-latest
            node-version: 24
            timeout_minutes: 25
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
      max-parallel: 2
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      build_command: pnpm ${{ matrix.build_pkgs_script }}
      main_command: |
        pnpm ${{ matrix.lint_script }}
        pnpm ${{ matrix.build_script }}
        pnpm test:coverage
      upload_codecov: true
    secrets: inherit

  build-full:
    if: github.event_name != 'pull_request'
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            timeout_minutes: 25
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
          - os: ubuntu-latest
            node-version: 24
            timeout_minutes: 25
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
          - os: windows-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:windows
            build_script: build:ci:windows
            lint_script: lint:ci:windows
          - os: windows-latest
            node-version: 24
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:windows
            build_script: build:ci:windows
            lint_script: lint:ci:windows
          - os: macos-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:macos
            build_script: build:ci:macos
            lint_script: lint
          - os: macos-latest
            node-version: 24
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:macos
            build_script: build:ci:macos
            lint_script: lint
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      build_command: pnpm ${{ matrix.build_pkgs_script }}
      main_command: |
        pnpm ${{ matrix.lint_script }}
        pnpm ${{ matrix.build_script }}
        pnpm test:coverage
      upload_codecov: true
    secrets: inherit

  weapi-compat-pr:
    if: github.event_name == 'pull_request'
    name: Weapi Compatibility Guard (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 15
      main_command: |
        pnpm --filter @weapp-core/api catalog:check
        pnpm --filter @weapp-core/api docs:check
        pnpm --filter @weapp-core/api lint
        pnpm --filter @weapp-core/api typecheck
        pnpm --filter @weapp-core/api typecheck:test
        pnpm --filter @weapp-core/api structure:check
        pnpm --filter @weapp-core/api strict-alias:check
        pnpm --filter @weapp-core/api coverage:check
        pnpm --filter @weapp-core/api test
        pnpm --filter @weapp-core/api test:types
        pnpm --filter @weapp-core/api report:api
        pnpm --filter @wevu/api lint
        pnpm --filter @wevu/api typecheck
        pnpm --filter @wevu/api typecheck:test
        pnpm --filter @wevu/api test
        pnpm --filter @wevu/api test:types
        git diff --exit-code -- \
          @weapp-core/api/README.md \
          @weapp-core/api/src/core/apiCatalog.ts \
          @weapp-core/api/src/core/types.ts \
          @weapp-core/api/src/index.ts \
          @weapp-core/api/types/index.d.ts \
          @weapp-core/api/reports/api-compat \
          packages-runtime/weapi/types/index.d.ts
    secrets: inherit

  weapi-compat-full:
    if: github.event_name != 'pull_request'
    name: Weapi Compatibility Guard (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 15
      main_command: |
        pnpm --filter @weapp-core/api catalog:check
        pnpm --filter @weapp-core/api docs:check
        pnpm --filter @weapp-core/api lint
        pnpm --filter @weapp-core/api typecheck
        pnpm --filter @weapp-core/api typecheck:test
        pnpm --filter @weapp-core/api structure:check
        pnpm --filter @weapp-core/api strict-alias:check
        pnpm --filter @weapp-core/api coverage:check
        pnpm --filter @weapp-core/api test
        pnpm --filter @weapp-core/api test:types
        pnpm --filter @weapp-core/api report:api
        pnpm --filter @wevu/api lint
        pnpm --filter @wevu/api typecheck
        pnpm --filter @wevu/api typecheck:test
        pnpm --filter @wevu/api test
        pnpm --filter @wevu/api test:types
        git diff --exit-code -- \
          @weapp-core/api/README.md \
          @weapp-core/api/src/core/apiCatalog.ts \
          @weapp-core/api/src/core/types.ts \
          @weapp-core/api/src/index.ts \
          @weapp-core/api/types/index.d.ts \
          @weapp-core/api/reports/api-compat \
          packages-runtime/weapi/types/index.d.ts
    secrets: inherit
