name: CI

on:
  # push:
  #   branches: ['main']
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      jsx_hmr_control:
        description: Run the fixed PR1180 JSX attribution pair only
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.jsx_hmr_control == true && '-jsx-control' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jsx-hmr-control:
    if: github.event_name == 'workflow_dispatch' && inputs.jsx_hmr_control == true
    name: JSX control (${{ matrix.snapshot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - snapshot: main650d
            ref: 650d329b43dd71a8f5bc6a7a4f137ffe312d7c36
          - snapshot: merge2e9
            ref: 2e9ac9a9711afaf78cff195a3d4fd2e2b605ca1a
    env:
      CI: 'true'
      HUSKY: '0'
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CACHE: local:rw
      WEAPP_VITE_HMR_PROFILE_JSON: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22.23.3
      - name: Record exact environment
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          cat /etc/os-release
          uname -m
          node --version
          pnpm --version
          git rev-parse HEAD
          node -e 'for (const name of ["vitest", "vite", "rolldown"]) { const p = require.resolve(`${name}/package.json`); console.log(name, require(p).version, p) }'
          shasum -a 256 package.json pnpm-lock.yaml .github/actions/setup-node-pnpm/action.yml packages/weapp-vite/test/runtime/jsxStatefulHmr.test.ts
          git ls-tree -r HEAD apps/wevu-jsx-tsx-demo/src
      - name: Fresh PR-style build
        run: pnpm build:ci
      - name: Original JSX cases with original assertions
        run: pnpm exec vitest run --configLoader bundle --coverage.enabled --exclude '**/.codex-tmp/**' packages/weapp-vite/test/runtime/jsxStatefulHmr.test.ts

  build-pr:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/pnpm-version')
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
            main_command: |
              pnpm lint
              pnpm build:ci
              pnpm test:coverage
              pnpm test:dependency-contracts
          - os: ubuntu-latest
            node-version: 24
            timeout_minutes: 25
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
            main_command: |
              pnpm build:pkgs:ci
              pnpm test:types
              pnpm test:dependency-contracts
          - os: windows-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:windows
            build_script: build:ci:windows
            lint_script: lint:ci:windows
            main_command: |
              pnpm build:ci:windows
              pnpm test:dependency-contracts
          - os: macos-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci:macos
            build_script: build:ci:macos
            lint_script: lint
            main_command: |
              pnpm build:ci:macos
              pnpm test:dependency-contracts
      max-parallel: 4
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      # Each PR command owns its single build stage; avoid a second package build in setup.
      build_command: ''
      main_command: ${{ matrix.main_command }}
      artifact_name: dependency-contracts-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: .tmp/dependency-contracts
      upload_codecov: true
    secrets: inherit

  build-release-pr:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/pnpm-version')
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            timeout_minutes: 40
            build_script: build:ci
            lint_script: lint
          - os: ubuntu-latest
            node-version: 24
            timeout_minutes: 40
            build_script: build:ci
            lint_script: lint
      max-parallel: 2
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      # The full build below owns package artifacts; do not build them again during setup.
      build_command: ''
      main_command: |
        pnpm ${{ matrix.lint_script }}
        pnpm ${{ matrix.build_script }}
        pnpm test:dependency-contracts
        pnpm test:coverage
      artifact_name: dependency-contracts-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: .tmp/dependency-contracts
      upload_codecov: true
    secrets: inherit

  build-full:
    if: github.event_name != 'pull_request' && inputs.jsx_hmr_control != true
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
          - os: ubuntu-latest
            node-version: 24
            timeout_minutes: 40
            build_pkgs_script: build:pkgs:ci
            build_script: build:ci
            lint_script: lint
          - os: windows-latest
            node-version: 22
            # Windows 安装与串行 lint/build 约 25 分钟，coverage 还需 35 分钟以上；总预算包含收尾。
            timeout_minutes: 90
            build_pkgs_script: build:pkgs:ci:windows
            build_script: build:ci:windows
            lint_script: lint:ci:windows
          - os: windows-latest
            node-version: 24
            timeout_minutes: 90
            build_pkgs_script: build:pkgs:ci:windows
            build_script: build:ci:windows
            lint_script: lint:ci:windows
          # 完整质量命令之外还包含依赖安装及 pnpm 缓存压缩上传，job 预算需覆盖收尾。
          - os: macos-latest
            node-version: 22
            timeout_minutes: 60
            build_pkgs_script: build:pkgs:ci:macos
            build_script: build:ci:macos
            lint_script: lint
          - os: macos-latest
            node-version: 24
            timeout_minutes: 60
            build_pkgs_script: build:pkgs:ci:macos
            build_script: build:ci:macos
            lint_script: lint
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ${{ matrix.os }}
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: ${{ matrix.timeout_minutes }}
      build_command: pnpm ${{ matrix.build_pkgs_script }}
      main_command: |
        pnpm ${{ matrix.lint_script }}
        pnpm ${{ matrix.build_script }}
        pnpm test:dependency-contracts
        pnpm test:coverage
      artifact_name: dependency-contracts-${{ matrix.os }}-node-${{ matrix.node-version }}
      artifact_path: .tmp/dependency-contracts
      upload_codecov: true
    secrets: inherit

  weapi-compat-pr:
    if: github.event_name == 'pull_request'
    name: Weapi Compatibility Guard (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 15
      main_command: |
        pnpm --filter @weapp-core/api catalog:check
        pnpm --filter @weapp-core/api docs:check
        pnpm --filter @weapp-core/api lint
        pnpm --filter @weapp-core/api typecheck
        pnpm --filter @weapp-core/api typecheck:test
        pnpm --filter @weapp-core/api structure:check
        pnpm --filter @weapp-core/api strict-alias:check
        pnpm --filter @weapp-core/api coverage:check
        pnpm --filter @weapp-core/api test
        pnpm --filter @weapp-core/api test:types
        pnpm --filter @weapp-core/api report:api
        pnpm --filter @wevu/api lint
        pnpm --filter @wevu/api typecheck
        pnpm --filter @wevu/api typecheck:test
        pnpm --filter @wevu/api test
        pnpm --filter @wevu/api test:types
        git diff --exit-code -- \
          @weapp-core/api/README.md \
          @weapp-core/api/src/core/apiCatalog.ts \
          @weapp-core/api/src/core/types.ts \
          @weapp-core/api/src/index.ts \
          @weapp-core/api/types/index.d.ts \
          @weapp-core/api/reports/api-compat \
          packages-runtime/weapi/types/index.d.ts
    secrets: inherit

  weapi-compat-full:
    if: github.event_name != 'pull_request' && inputs.jsx_hmr_control != true
    name: Weapi Compatibility Guard (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      runs_on: ubuntu-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 15
      main_command: |
        pnpm --filter @weapp-core/api catalog:check
        pnpm --filter @weapp-core/api docs:check
        pnpm --filter @weapp-core/api lint
        pnpm --filter @weapp-core/api typecheck
        pnpm --filter @weapp-core/api typecheck:test
        pnpm --filter @weapp-core/api structure:check
        pnpm --filter @weapp-core/api strict-alias:check
        pnpm --filter @weapp-core/api coverage:check
        pnpm --filter @weapp-core/api test
        pnpm --filter @weapp-core/api test:types
        pnpm --filter @weapp-core/api report:api
        pnpm --filter @wevu/api lint
        pnpm --filter @wevu/api typecheck
        pnpm --filter @wevu/api typecheck:test
        pnpm --filter @wevu/api test
        pnpm --filter @wevu/api test:types
        git diff --exit-code -- \
          @weapp-core/api/README.md \
          @weapp-core/api/src/core/apiCatalog.ts \
          @weapp-core/api/src/core/types.ts \
          @weapp-core/api/src/index.ts \
          @weapp-core/api/types/index.d.ts \
          @weapp-core/api/reports/api-compat \
          packages-runtime/weapi/types/index.d.ts
    secrets: inherit
