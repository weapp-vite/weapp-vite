name: CI

on:
  # push:
  #   branches: ['main']
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      exclude-e2e-projects:
        description: 排除的 E2E 专项 workspace，逗号分隔；留空运行完整范围
        required: false
        default: ''
        type: string
      pr-number:
        description: PR 编号；留空保留当前分支或定时验证
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      profile: ci
  validation:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    uses: ./.github/workflows/validate-ci.yml
    with:
      pr_context: ${{ needs.pr-context.outputs.pr_context }}
      exclude-e2e-projects: ${{ inputs.exclude-e2e-projects || '' }}
    secrets: inherit
