name: Acceptance and Agent
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to validate (empty uses the selected ref)
        required: false
        default: ''
        type: string
      scope:
        description: Acceptance validation scope
        type: choice
        default: full
        options:
          - full
          - windows-runtime-diagnostic
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: acceptance-${{ inputs.scope || 'full' }}-${{ inputs.pr-number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      profile: ci-acceptance
  validation:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    uses: ./.github/workflows/validate-ci-acceptance.yml
    with:
      pr_context: ${{ needs.pr-context.outputs.pr_context }}
      scope: ${{ inputs.scope || 'full' }}
    secrets: inherit
