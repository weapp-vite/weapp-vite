name: Validate Deploy Website
on:
  workflow_call:
    inputs:
      pr_context:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read

env:
  LEFTHOOK: '0'

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      pr_context: ${{ inputs.pr_context }}
      profile: deploy-website

  website:
    if: needs.pr-context.outputs.should_run == 'true'
    needs: pr-context
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CHECKOUT_SHA: ${{ needs.pr-context.outputs.checkout_sha }}
      REPO_DOCS_CHANNEL: preview
    steps:
      - name: Check out code with page history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr-context.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24'

      - name: Test and build website with channel assertions
        run: pnpm docs:build

      - name: Validate Cloudflare deployment without credentials
        run: pnpm --filter website-weapp-vite deploy:preview:dry-run

      - name: Upload website artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-${{ needs.pr-context.outputs.checkout_sha }}-${{ github.run_attempt }}
          path: website/dist
          retention-days: 7
          if-no-files-found: error
