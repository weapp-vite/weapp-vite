name: Validate Acceptance and Agent
on:
  workflow_call:
    inputs:
      verification_topology:
        required: false
        type: string
        default: optimized-v1
      pr_context:
        required: true
        type: string
      scope:
        type: string
        required: false
        default: full
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    if: inputs.verification_topology != 'optimized-v2'
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      profile: ci-acceptance

  compatibility:
    needs: pr-context
    if: ${{ !cancelled() && (inputs.verification_topology == 'optimized-v2' || needs.pr-context.result == 'success') && ((inputs.verification_topology == 'optimized-v2' && ((fromJSON(inputs.pr_context).event == 'pull_request' && fromJSON(inputs.pr_context).selections['ci-acceptance'] || fromJSON(inputs.pr_context).event != 'pull_request' && fromJSON(inputs.pr_context).shouldRun) && 'true' || 'false') || needs.pr-context.outputs.should_run) == 'true' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      WEAPP_VITE_VERIFICATION_TOPOLOGY: ${{ inputs.verification_topology }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
          persist-credentials: false
      - name: Validate frozen identity in the executing job
        if: inputs.verification_topology == 'optimized-v2'
        uses: ./.github/actions/verify-frozen-job-context
        with:
          context: ${{ inputs.pr_context }}
          profile: ci-acceptance
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter weapp-vite... --filter @weapp-agent/cli... -r build
      - run: pnpm --filter @weapp-agent/core --filter @weapp-agent/providers --filter @weapp-agent/mini-program --filter @weapp-agent/cli --filter @weapp-vite/acceptance --filter @weapp-vite/mcp --filter @weapp-vite/devtools-runtime -r typecheck
      - if: matrix.os != 'windows-latest'
        run: pnpm --filter @weapp-agent/core --filter @weapp-agent/providers --filter @weapp-agent/mini-program --filter @weapp-agent/cli --filter @weapp-vite/acceptance --filter @weapp-vite/mcp --filter @weapp-vite/devtools-runtime -r test
      # Windows 文件系统与进程互斥测试共享 runner 容量；保留用例内部并发和原始预算。
      - if: matrix.os == 'windows-latest'
        run: pnpm --workspace-concurrency=1 --filter @weapp-agent/core --filter @weapp-agent/providers --filter @weapp-agent/mini-program --filter @weapp-agent/cli --filter @weapp-vite/acceptance --filter @weapp-vite/mcp --filter @weapp-vite/devtools-runtime -r test --no-file-parallelism
      - run: pnpm --filter @weapp-agent/core test:types
      - run: node scripts/weapp-agent/smoke-pack.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: node scripts/weapp-agent/smoke-baseline.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: node scripts/weapp-agent/smoke-baseline.mjs

  windows-runtime-diagnostic:
    needs: pr-context
    if: ${{ !cancelled() && (inputs.verification_topology == 'optimized-v2' || needs.pr-context.result == 'success') && ((inputs.verification_topology == 'optimized-v2' && ((fromJSON(inputs.pr_context).event == 'pull_request' && fromJSON(inputs.pr_context).selections['ci-acceptance'] || fromJSON(inputs.pr_context).event != 'pull_request' && fromJSON(inputs.pr_context).shouldRun) && 'true' || 'false') || needs.pr-context.outputs.should_run) == 'true' && (github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-runtime-diagnostic')) }}
    name: Windows acceptance runtime (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      pr_profile: ci-acceptance
      checkout_ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
      base_sha: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).baseSha || needs.pr-context.outputs.base_sha) }}
      head_sha: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headSha || needs.pr-context.outputs.head_sha) }}
      pr_number: ${{ (inputs.verification_topology == 'optimized-v2' && format('{0}', fromJSON(inputs.pr_context).prNumber || '') || needs.pr-context.outputs.pr_number) }}
      head_ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headRef || needs.pr-context.outputs.head_ref) }}
      base_ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).baseRef || needs.pr-context.outputs.base_ref) }}
      runs_on: windows-latest
      node_version: '${{ matrix.node-version }}'
      timeout_minutes: 25
      build_command: pnpm exec turbo run build --filter=@weapp-agent/mini-program...
      main_command: |
        pnpm --filter @weapp-agent/mini-program typecheck
        pnpm --filter @weapp-agent/mini-program exec vitest run --configLoader bundle --coverage.enabled --maxWorkers=50% test/acceptance.test.ts --reporter=default --reporter=json --outputFile=../../.tmp/acceptance-runtime-report.json
      artifact_name: acceptance-runtime-windows-node-${{ matrix.node-version }}-${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
      artifact_path: .tmp/acceptance-runtime-report.json
    secrets: inherit
