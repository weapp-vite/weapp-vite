name: Candidate Performance

on:
  push:
    tags:
      - 'codex/performance-candidate/*'
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Full candidate SHA; must equal the selected workflow commit
        type: string
        required: true

concurrency:
  group: nightly-performance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/codex/performance-candidate/')
    name: Freeze explicit candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      previous_run_id: ${{ steps.plan.outputs.previous_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate-sha || github.sha }}
        run: node scripts/performanceGate/candidate.mjs plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance-plan
          path: performance-plan
          if-no-files-found: error
          retention-days: 90

  collect:
    name: Full performance (${{ matrix.target }} / ${{ matrix.os }} / ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.has_work == 'true' && github.run_attempt == 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # 单个目标有三 OS × 九个独立分片；分片内的成对采样仍串行执行。
      max-parallel: 27
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out trusted driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: driver
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out measured head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          repository: ${{ matrix.headRepository }}
          ref: ${{ matrix.headSha }}
          persist-credentials: false
      - name: Check out approved baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ matrix.baselineSha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: performance-plan
          path: performance-plan
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: driver/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: driver/pnpm-lock.yaml
      - name: Install trusted driver dependencies
        working-directory: driver
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install head dependencies
        working-directory: head
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install baseline dependencies
        working-directory: baseline
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Collect paired shard
        working-directory: driver
        env:
          PERFORMANCE_PURPOSE: full
          PERFORMANCE_PLAN: ${{ github.workspace }}/performance-plan/plan.json
          PERFORMANCE_TARGET: ${{ matrix.target }}
          PERFORMANCE_SHARD: ${{ matrix.shard }}
          PERFORMANCE_OS: ${{ matrix.os }}
          TEMPLATES_PERF_BASELINE_DIR: ${{ github.workspace }}/baseline
          TEMPLATES_PERF_OPTIMIZED_DIR: ${{ github.workspace }}/head
          TEMPLATES_PERF_REPORT_DIR: ${{ runner.temp }}/performance-shard
          # 清理不参与性能采样；保存 Windows 查询阶段，定位 CIM 超时并保留原十秒预算。
          WEAPP_VITE_E2E_CLEANUP_TRACE: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: pnpm exec tsx scripts/performanceGate/full.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/performance-shard
          if-no-files-found: error
          retention-days: 90

  summary:
    name: Full candidate performance verdict
    needs: [plan, collect]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: performance-*
          path: performance-artifacts
      - name: Verify every planned shard
        env:
          PERFORMANCE_PLAN: performance-artifacts/performance-plan/plan.json
          PERFORMANCE_ARTIFACTS: performance-artifacts
        run: node scripts/performanceGate/aggregate.mjs
      - name: Restore original evidence for a reused success
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.previous_run_id != ''
        with:
          pattern: performance-*
          path: performance-artifacts/previous
          run-id: ${{ needs.plan.outputs.previous_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate candidate provenance and publish immutable status
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFORMANCE_ARTIFACTS: performance-artifacts
        run: node scripts/performanceGate/candidate.mjs publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance-nightly-summary
          path: |
            nightly-report.json
            nightly-report.md
          if-no-files-found: error
          retention-days: 90
