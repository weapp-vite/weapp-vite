# repoctl-managed: release/v2
name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  # 每天 06:17（Asia/Shanghai），与完整性能采样错峰。
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
          - reconcile
          - oidc-audit
          - nightly
          - bootstrap
      package:
        description: Exact package for recovery, OIDC audit or bootstrap
        required: false
        type: string
      version:
        description: Exact version for unpublished-version recovery or bootstrap
        required: false
        type: string
      dry-run:
        description: Preview reconciliation, nightly or bootstrap without changes
        required: false
        default: false
        type: boolean
      source-sha:
        description: Original main commit to recover (publish modes only)
        required: false
        type: string
      acknowledge-marketplace-hook:
        description: Recovery only, after verifying the published Marketplace version and original source tag
        required: false
        default: false
        type: boolean
      tag:
        description: Non-latest bootstrap dist-tag
        required: false
        default: alpha
        type: string
      verify-run-id:
        description: Verify an existing bootstrap publication without republishing
        required: false
        type: string

env:
  LEFTHOOK: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: ${{ github.event_name != 'schedule' && inputs.mode != 'nightly' && inputs.mode != 'oidc-audit' && inputs.mode != 'bootstrap' }}
    # npm 发布完成即释放互斥，文档部署使用自己的队列。
    concurrency:
      group: npm-release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release-record: ${{ steps.release-finalize.outputs.release-record }}
      docs-sites: ${{ steps.release-finalize.outputs.docs-sites }}
    name: Release
    runs-on: ubuntu-latest
    # 六个发布阶段共享 50 分钟，为安装、缓存、归档和清理保留其余预算。
    timeout-minutes: 60
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
      REPO_RELEASE_PACKAGE: ${{ inputs.package }}
      REPO_RELEASE_VERSION: ${{ inputs.version }}
      REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
      REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
      REPO_RELEASE_ACKNOWLEDGE_HOOKS: ${{ inputs.acknowledge-marketplace-hook && 'release:vscode-marketplace' || '' }}
      REPOCTL_RELEASE_BUDGET_SECONDS: 3000
      TURBO_CACHE: local:rw
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Git 与发布 API 统一复用内置令牌；自动 PR 的运行仍需要 GitHub 原生审批。
          token: ${{ github.token }}

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24'
          install-dependencies: 'false'
          freeze-toolchain: 'false'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate release recovery inputs
        run: node .github/scripts/release-recovery-inputs.mjs

      - name: Prepare GNU timeout for current and historical release checks
        run: bash .github/scripts/prepare-release-timeout.sh

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Record release cache toolchain
        run: |
          {
            echo "REPOCTL_RELEASE_PLATFORM=$(node --print process.platform)"
            echo "REPOCTL_RELEASE_ARCH=$(node --print process.arch)"
            echo "REPOCTL_RELEASE_NODE_VERSION=$(node --version)"
            echo "REPOCTL_RELEASE_PNPM_VERSION=$(pnpm --version)"
          } >> "$GITHUB_ENV"

      - name: Restore release build and lint cache
        id: release-cache
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          # 最终缓存契约使用新命名空间，隔离升级验证期间的候选缓存。
          key: release-turbo-v2-${{ env.REPOCTL_RELEASE_PLATFORM }}-${{ env.REPOCTL_RELEASE_ARCH }}-node-${{ env.REPOCTL_RELEASE_NODE_VERSION }}-pnpm-${{ env.REPOCTL_RELEASE_PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-turbo-v2-${{ env.REPOCTL_RELEASE_PLATFORM }}-${{ env.REPOCTL_RELEASE_ARCH }}-node-${{ env.REPOCTL_RELEASE_NODE_VERSION }}-pnpm-${{ env.REPOCTL_RELEASE_PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Start shared release deadline
        run: echo "REPOCTL_RELEASE_DEADLINE_EPOCH=$(($(date +%s) + REPOCTL_RELEASE_BUDGET_SECONDS))" >> "$GITHUB_ENV"

      - name: Release plan
        id: release-plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh plan

      - name: Release verify
        id: release-verify
        if: ${{ steps.release-plan.outputs.run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh verify

      - name: Release prepare
        id: release-prepare
        if: ${{ steps.release-plan.outputs.run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh prepare

      - name: Release upload
        id: release-upload
        if: ${{ steps.release-prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh upload

      - name: Release confirm
        id: release-confirm
        if: ${{ steps.release-prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh confirm

      - name: Release finalize
        id: release-finalize
        if: ${{ steps.release-prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh finalize

      - name: Save release build and lint cache
        if: ${{ success() && steps.release-plan.outputs.run == 'true' && steps.release-cache.outputs.cache-primary-key != '' && contains(fromJSON('["refs/heads/main", "refs/heads/alpha", "refs/heads/beta", "refs/heads/rc", "refs/heads/next"]'), github.ref) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

      - name: Preserve npm publish progress
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-publish-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pnpm-publish-summary.json
            repoctl-publish-progress.json
            repoctl-release-progress.json
            repoctl-ci-progress.json
          if-no-files-found: ignore
          retention-days: 14

  docs:
    needs: release
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.release.outputs.release-record != '' && needs.release.outputs.docs-sites != '' && needs.release.outputs.docs-sites != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.release.outputs.docs-sites) }}
    uses: ./.github/workflows/repoctl-docs-deploy.yml
    with:
      site: ${{ matrix.site }}
      channel: stable
      release: ${{ needs.release.outputs.release-record }}
    secrets: inherit

  nightly:
    name: Publish nightly
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 22 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly') }}
    concurrency:
      group: npm-release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 42 个包逐个打包、上传及消费检查；90 分钟曾在最后一个包上传时终止。
    # 质量门禁仍共享 45 分钟，其余时间覆盖发布确认、消费检查与诊断。
    timeout-minutes: 240
    env:
      REPOCTL_NIGHTLY_PROVIDER: npm
      REPOCTL_NIGHTLY_SCHEDULE: '17 22 * * *'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate nightly source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo '::error::Nightly publication requires the repository default branch.'
            exit 1
          fi

      - name: Checkout nightly source
        id: nightly-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: default
          install-dependencies: 'false'
          freeze-toolchain: 'false'

      - name: Install npm with trusted publishing support
        id: nightly-npm
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org

      - name: Install Dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish nightly packages
        id: nightly-publish
        env:
          REPOCTL_SNAPSHOT_PUBLISH: '1'
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          if [ -n "$REPO_RELEASE_PACKAGE$REPO_RELEASE_VERSION$REPO_RELEASE_RECOVERY_SOURCE_SHA" ]; then
            echo '::error::Nightly always publishes all public packages at the current default-branch commit; recovery inputs are not supported.'
            exit 1
          fi
          args=(--publish --output "$RUNNER_TEMP/repoctl-nightly" --json)
          if [ "$REPO_RELEASE_DRY_RUN" = 'true' ]; then
            args+=(--dry-run)
          fi
          # 质量检查共享 45 分钟，后续打包、上传、consumer 和诊断仍受 job 总预算约束。
          export REPOCTL_NIGHTLY_QUALITY_DEADLINE_EPOCH="$(( $(date +%s) + 2700 ))"
          pnpm exec repo release nightly "${args[@]}"

      - name: Preserve nightly diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repoctl-nightly/*.json
            ${{ runner.temp }}/repoctl-nightly/repoctl-nightly-*/*.json
            ${{ runner.temp }}/repoctl-nightly/repoctl-nightly-*/repoctl-snapshot-*/*.json
            ${{ runner.temp }}/repoctl-nightly/repoctl-nightly-*/repoctl-snapshot-*/tarballs/*/*.tgz
          if-no-files-found: ignore
          retention-days: 14

  oidc-audit:
    name: Audit npm OIDC
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'oidc-audit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate audit source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo '::error::npm OIDC audit requires the repository default branch.'
            exit 1
          fi

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: default
          install-dependencies: 'false'
          freeze-toolchain: 'false'

      - name: Install Dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit selected publishable packages
        env:
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
          REPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          REPO_RELEASE_RECOVERY_SOURCE_SHA: ${{ inputs.source-sha }}
        run: pnpm exec repo release ci --mode oidc-audit
  bootstrap-prepare:
    name: Prepare bootstrap package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' && inputs.verify-run-id == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout bootstrap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: default
          install-dependencies: 'false'
          freeze-toolchain: 'false'

      - name: Install Dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare bootstrap package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_PACKAGE: ${{ inputs.package }}
          BOOTSTRAP_VERSION: ${{ inputs.version }}
          BOOTSTRAP_TAG: ${{ inputs.tag || 'alpha' }}
          BOOTSTRAP_DRY_RUN: ${{ inputs.dry-run }}
          BOOTSTRAP_SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          if [ -n "$BOOTSTRAP_SOURCE_SHA" ]; then
            echo 'Bootstrap does not accept source-sha recovery.' >&2
            exit 1
          fi
          args=(release bootstrap --stage prepare --package "$BOOTSTRAP_PACKAGE" --version "$BOOTSTRAP_VERSION" --tag "$BOOTSTRAP_TAG" --output "$RUNNER_TEMP/repoctl-bootstrap" --json)
          if [ "$BOOTSTRAP_DRY_RUN" = 'true' ]; then
            args+=(--dry-run)
          fi
          pnpm exec repo "${args[@]}"

      - name: Preserve bootstrap package
        if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repoctl-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repoctl-bootstrap/bootstrap-manifest.json
            ${{ runner.temp }}/repoctl-bootstrap/tarballs/
          if-no-files-found: error
          retention-days: 14
  bootstrap-publish:
    name: Publish bootstrap package
    needs: bootstrap-prepare
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' && inputs.verify-run-id == '' && !inputs.dry-run && needs.bootstrap-prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      REPOCTL_BOOTSTRAP_TOOL_VERSION: 6.4.0
    steps:
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Install official bootstrap publisher
        id: bootstrap-tool
        run: npm install --prefix "$RUNNER_TEMP/repoctl-bootstrap-tool" --ignore-scripts --no-package-lock --no-audit --no-fund "repoctl@$REPOCTL_BOOTSTRAP_TOOL_VERSION" --registry=https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0 --registry=https://registry.npmjs.org

      - name: Publish bootstrap package
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_PACKAGE: ${{ inputs.package }}
          BOOTSTRAP_VERSION: ${{ inputs.version }}
          BOOTSTRAP_TAG: ${{ inputs.tag || 'alpha' }}
        run: node "$RUNNER_TEMP/repoctl-bootstrap-tool/node_modules/repoctl/bin/repo.js" release bootstrap --stage publish --package "$BOOTSTRAP_PACKAGE" --version "$BOOTSTRAP_VERSION" --tag "$BOOTSTRAP_TAG" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/repoctl-bootstrap-publication" --json

      - name: Preserve bootstrap publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repoctl-bootstrap-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repoctl-bootstrap-publication/
          if-no-files-found: error
          retention-days: 14
    concurrency:
      group: npm-release-${{ github.ref }}
      cancel-in-progress: false
  bootstrap-verify:
    name: Verify bootstrap publication
    needs: [bootstrap-prepare, bootstrap-publish]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' && !inputs.dry-run && (inputs.verify-run-id != '' || needs.bootstrap-publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      REPOCTL_BOOTSTRAP_TOOL_VERSION: 6.4.0
    steps:
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Install official bootstrap verifier
        id: bootstrap-tool
        run: npm install --prefix "$RUNNER_TEMP/repoctl-bootstrap-tool" --ignore-scripts --no-package-lock --no-audit --no-fund "repoctl@$REPOCTL_BOOTSTRAP_TOOL_VERSION" --registry=https://registry.npmjs.org

      - name: Verify existing bootstrap publication
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_PACKAGE: ${{ inputs.package }}
          BOOTSTRAP_VERSION: ${{ inputs.version }}
          BOOTSTRAP_TAG: ${{ inputs.tag || 'alpha' }}
          BOOTSTRAP_VERIFY_RUN_ID: ${{ inputs.verify-run-id || github.run_id }}
        run: node "$RUNNER_TEMP/repoctl-bootstrap-tool/node_modules/repoctl/bin/repo.js" release bootstrap --stage verify --package "$BOOTSTRAP_PACKAGE" --version "$BOOTSTRAP_VERSION" --tag "$BOOTSTRAP_TAG" --verify-run-id "$BOOTSTRAP_VERIFY_RUN_ID" --output "$RUNNER_TEMP/repoctl-bootstrap-verification" --json

      - name: Preserve bootstrap verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repoctl-bootstrap-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repoctl-bootstrap-verification/
          if-no-files-found: error
          retention-days: 14
