# repoctl-managed: release/v2
name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
      package:
        description: Package used for unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used for unpublished-version recovery
        required: false
        type: string

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repo release CI
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm exec repo release ci
