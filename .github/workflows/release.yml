# repoctl-managed: release/v2
name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
      package:
        description: Package used for unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used for unpublished-version recovery
        required: false
        type: string

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # 六个发布阶段共享 50 分钟，为安装、缓存、归档和清理保留其余预算。
    timeout-minutes: 60
    env:
      REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
      REPO_RELEASE_PACKAGE: ${{ inputs.package }}
      REPO_RELEASE_VERSION: ${{ inputs.version }}
      REPOCTL_RELEASE_BUDGET_SECONDS: 3000
      TURBO_CACHE: local:rw
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 版本分支可能包含 workflow 更新；Git 与发布 API 必须使用相同发布凭据。
          token: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Record release cache toolchain
        run: |
          echo "REPOCTL_RELEASE_PLATFORM=$(node --print process.platform)" >> "$GITHUB_ENV"
          echo "REPOCTL_RELEASE_ARCH=$(node --print process.arch)" >> "$GITHUB_ENV"
          echo "REPOCTL_RELEASE_NODE_VERSION=$(node --version)" >> "$GITHUB_ENV"
          echo "REPOCTL_RELEASE_PNPM_VERSION=$(pnpm --version)" >> "$GITHUB_ENV"

      - name: Restore release build and lint cache
        id: release-cache
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          # 最终缓存契约使用新命名空间，隔离升级验证期间的候选缓存。
          key: release-turbo-v2-${{ env.REPOCTL_RELEASE_PLATFORM }}-${{ env.REPOCTL_RELEASE_ARCH }}-node-${{ env.REPOCTL_RELEASE_NODE_VERSION }}-pnpm-${{ env.REPOCTL_RELEASE_PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-turbo-v2-${{ env.REPOCTL_RELEASE_PLATFORM }}-${{ env.REPOCTL_RELEASE_ARCH }}-node-${{ env.REPOCTL_RELEASE_NODE_VERSION }}-pnpm-${{ env.REPOCTL_RELEASE_PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Start shared release deadline
        run: echo "REPOCTL_RELEASE_DEADLINE_EPOCH=$(($(date +%s) + REPOCTL_RELEASE_BUDGET_SECONDS))" >> "$GITHUB_ENV"

      - name: Release plan
        id: release-plan
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh plan

      - name: Release verify
        id: release-verify
        if: ${{ steps.release-plan.outputs.run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh verify

      - name: Release prepare
        id: release-prepare
        if: ${{ steps.release-plan.outputs.run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh prepare

      - name: Release upload
        id: release-upload
        if: ${{ steps.release-prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh upload

      - name: Release confirm
        id: release-confirm
        if: ${{ steps.release-prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh confirm

      - name: Release finalize
        id: release-finalize
        if: ${{ steps.release-prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: bash .github/scripts/release-stage.sh finalize

      - name: Save release build and lint cache
        if: ${{ success() && steps.release-plan.outputs.run == 'true' && steps.release-cache.outputs.cache-primary-key != '' && contains(fromJSON('["refs/heads/main", "refs/heads/alpha", "refs/heads/beta", "refs/heads/rc", "refs/heads/next"]'), github.ref) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

      - name: Preserve npm publish progress
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-publish-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pnpm-publish-summary.json
            repoctl-publish-progress.json
            repoctl-release-progress.json
            repoctl-ci-progress.json
          if-no-files-found: ignore
          retention-days: 14
