name: Wevu Runtime Size

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Optional open PR number; empty skips PR-only runtime comparison
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      profile: wevu-runtime-size
  validation:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    uses: ./.github/workflows/validate-wevu-runtime-size.yml
    with:
      pr_context: ${{ needs.pr-context.outputs.pr_context }}
    secrets: inherit
