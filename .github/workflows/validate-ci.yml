name: Validate CI
on:
  workflow_call:
    inputs:
      verification_topology:
        required: false
        type: string
        default: optimized-v1
      pr_context:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-context:
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      pr_context: ${{ inputs.pr_context }}
      profile: ci
  build-pr:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && !startsWith(needs.pr-context.outputs.head_ref, 'release/pnpm-version'))
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            build_command: pnpm build:ci
            lint_command: pnpm lint
            run_types: false
            run_coverage: true
          - os: ubuntu-latest
            node-version: 24
            build_command: pnpm build:pkgs:ci
            lint_command: ''
            run_types: true
            run_coverage: false
          - os: windows-latest
            node-version: 22
            build_command: pnpm build:ci:windows
            lint_command: ''
            run_types: false
            run_coverage: false
          - os: macos-latest
            node-version: 22
            build_command: pnpm build:ci:macos
            lint_command: ''
            run_types: false
            run_coverage: false
      max-parallel: 4
    uses: ./.github/workflows/reusable-quality-platform.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      runs_on: ${{ matrix.os }}
      node_version: ${{ format('{0}', matrix.node-version) }}
      build_command: ${{ matrix.build_command }}
      lint_command: ${{ matrix.lint_command }}
      run_types: ${{ matrix.run_types }}
      run_coverage: ${{ matrix.run_coverage }}
    secrets: inherit
  build-release-pr:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true' && startsWith(needs.pr-context.outputs.head_ref, 'release/pnpm-version'))
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            build_command: pnpm build:ci
            lint_command: pnpm lint
            run_types: false
            run_coverage: true
          - os: ubuntu-latest
            node-version: 24
            build_command: pnpm build:ci
            lint_command: pnpm lint
            run_types: false
            run_coverage: true
      max-parallel: 2
    uses: ./.github/workflows/reusable-quality-platform.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      runs_on: ${{ matrix.os }}
      node_version: ${{ format('{0}', matrix.node-version) }}
      build_command: ${{ matrix.build_command }}
      lint_command: ${{ matrix.lint_command }}
      run_types: ${{ matrix.run_types }}
      run_coverage: ${{ matrix.run_coverage }}
    secrets: inherit
  build-full:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true')
    name: Build and Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
            build_command: pnpm build:ci
            lint_command: pnpm lint
            run_types: false
            run_coverage: true
          - os: ubuntu-latest
            node-version: 24
            build_command: pnpm build:ci
            lint_command: pnpm lint
            run_types: false
            run_coverage: true
          - os: windows-latest
            node-version: 22
            build_command: pnpm build:ci:windows
            lint_command: pnpm lint:ci:windows
            run_types: false
            run_coverage: true
          - os: windows-latest
            node-version: 24
            build_command: pnpm build:ci:windows
            lint_command: pnpm lint:ci:windows
            run_types: false
            run_coverage: true
          - os: macos-latest
            node-version: 22
            build_command: pnpm build:ci:macos
            lint_command: pnpm lint
            run_types: false
            run_coverage: true
          - os: macos-latest
            node-version: 24
            build_command: pnpm build:ci:macos
            lint_command: pnpm lint
            run_types: false
            run_coverage: true
    uses: ./.github/workflows/reusable-quality-platform.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      runs_on: ${{ matrix.os }}
      node_version: ${{ format('{0}', matrix.node-version) }}
      build_command: ${{ matrix.build_command }}
      lint_command: ${{ matrix.lint_command }}
      run_types: ${{ matrix.run_types }}
      run_coverage: ${{ matrix.run_coverage }}
    secrets: inherit
  weapi-compat-pr:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr == 'true')
    name: Weapi Compatibility Guard (Node 24)
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: '24'
      timeout_minutes: 15
      main_command: |
        pnpm --filter @weapp-core/api catalog:check
        pnpm --filter @weapp-core/api docs:check
        pnpm --filter @weapp-core/api lint
        pnpm --filter @weapp-core/api typecheck
        pnpm --filter @weapp-core/api typecheck:test
        pnpm --filter @weapp-core/api structure:check
        pnpm --filter @weapp-core/api strict-alias:check
        pnpm --filter @weapp-core/api coverage:check
        pnpm --filter @weapp-core/api test
        pnpm --filter @weapp-core/api test:types
        pnpm --filter @weapp-core/api report:api
        pnpm --filter @wevu/api lint
        pnpm --filter @wevu/api typecheck
        pnpm --filter @wevu/api typecheck:test
        pnpm --filter @wevu/api test
        pnpm --filter @wevu/api test:types
        git diff --exit-code -- \
          @weapp-core/api/README.md \
          @weapp-core/api/src/core/apiCatalog.ts \
          @weapp-core/api/src/core/types.ts \
          @weapp-core/api/src/index.ts \
          @weapp-core/api/types/index.d.ts \
          @weapp-core/api/reports/api-compat \
          packages-runtime/weapi/types/index.d.ts
    secrets: inherit
  weapi-compat-full:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true' && (needs.pr-context.outputs.is_pr != 'true')
    name: Weapi Compatibility Guard (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version:
          - 22
          - 24
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      checkout_ref: ${{ needs.pr-context.outputs.checkout_sha }}
      base_sha: ${{ needs.pr-context.outputs.base_sha }}
      head_sha: ${{ needs.pr-context.outputs.head_sha }}
      pr_number: ${{ needs.pr-context.outputs.pr_number }}
      head_ref: ${{ needs.pr-context.outputs.head_ref }}
      base_ref: ${{ needs.pr-context.outputs.base_ref }}
      runs_on: ubuntu-latest
      node_version: ${{ matrix.node-version }}
      timeout_minutes: 15
      main_command: |
        pnpm --filter @weapp-core/api catalog:check
        pnpm --filter @weapp-core/api docs:check
        pnpm --filter @weapp-core/api lint
        pnpm --filter @weapp-core/api typecheck
        pnpm --filter @weapp-core/api typecheck:test
        pnpm --filter @weapp-core/api structure:check
        pnpm --filter @weapp-core/api strict-alias:check
        pnpm --filter @weapp-core/api coverage:check
        pnpm --filter @weapp-core/api test
        pnpm --filter @weapp-core/api test:types
        pnpm --filter @weapp-core/api report:api
        pnpm --filter @wevu/api lint
        pnpm --filter @wevu/api typecheck
        pnpm --filter @wevu/api typecheck:test
        pnpm --filter @wevu/api test
        pnpm --filter @wevu/api test:types
        git diff --exit-code -- \
          @weapp-core/api/README.md \
          @weapp-core/api/src/core/apiCatalog.ts \
          @weapp-core/api/src/core/types.ts \
          @weapp-core/api/src/index.ts \
          @weapp-core/api/types/index.d.ts \
          @weapp-core/api/reports/api-compat \
          packages-runtime/weapi/types/index.d.ts
    secrets: inherit
