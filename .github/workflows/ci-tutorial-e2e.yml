name: Tutorial E2E

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to validate (empty uses the selected ref)
        required: false
        default: ''
        type: string
      source:
        description: Tutorial package source
        required: false
        default: both
        type: choice
        options:
          - both
          - npm
          - workspace
      scenario:
        description: Optional comma-separated tutorial scenario ids
        required: false
        default: all
        type: string

concurrency:
  group: tutorial-e2e-${{ inputs.pr-number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    uses: ./.github/workflows/reusable-pr-context.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    with:
      pr_number: ${{ inputs.pr-number || '' }}
      profile: ci-tutorial-e2e
  validation:
    needs: pr-context
    if: needs.pr-context.outputs.should_run == 'true'
    uses: ./.github/workflows/validate-ci-tutorial-e2e.yml
    with:
      pr_context: ${{ needs.pr-context.outputs.pr_context }}
      source: ${{ inputs.source || 'both' }}
      scenario: ${{ inputs.scenario || 'all' }}
    secrets: inherit
