name: "repoctl PR snapshot build"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR to approve and build
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SNAPSHOT_BUILDER_WORKFLOW: ".github/workflows/repoctl-snapshot-build.yml"

jobs:
  freeze:
    name: Freeze snapshot plan
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: "pr-ci-approval"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      merge_sha: ${{ steps.source.outputs.merge_sha }}
      plan_artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install the pinned trusted tool outside candidate code
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/repoctl-tools" --ignore-scripts --no-audit --no-fund --package-lock=false repoctl@6.3.1 pnpm@12.16.1
          echo "$RUNNER_TEMP/repoctl-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Freeze the approved PR revision
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/repoctl-tools/node_modules/.bin/repo" release snapshot source --pr "$PR_NUMBER" --builder-workflow "$SNAPSHOT_BUILDER_WORKFLOW" --out "$RUNNER_TEMP/snapshot-source.json" --json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/snapshot-source.json`, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `merge_sha=${source.mergeSha}\n`);
          NODE
      - name: Read only the frozen candidate metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.merge_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Create the trusted package and dependency plan without candidate scripts
        working-directory: ${{ github.workspace }}/candidate
        run: |
          "$RUNNER_TEMP/repoctl-tools/node_modules/.bin/repo" release snapshot freeze --source "$RUNNER_TEMP/snapshot-source.json" --out "$RUNNER_TEMP/snapshot-plan.json" --json
      - name: Upload the frozen plan
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-plan.json
          if-no-files-found: error
          retention-days: 14
      - name: Bind the immutable plan artifact in this trusted job log
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/repoctl-tools/node_modules/.bin/repo" release snapshot seal --plan "$RUNNER_TEMP/snapshot-plan.json" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

  build:
    name: Build snapshot packages
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install the pinned preparation tool
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/repoctl-tools" --ignore-scripts --no-audit --no-fund --package-lock=false repoctl@6.3.1 pnpm@12.16.1
          echo "$RUNNER_TEMP/repoctl-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.freeze.outputs.plan_artifact }}
          path: ${{ runner.temp }}/snapshot-plan
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.freeze.outputs.merge_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Build and validate the frozen snapshot packages
        id: prepare
        working-directory: ${{ github.workspace }}/candidate
        run: |
          "$RUNNER_TEMP/repoctl-tools/node_modules/.bin/repo" release snapshot prepare --plan "$RUNNER_TEMP/snapshot-plan/snapshot-plan.json" --output "$RUNNER_TEMP/snapshot-artifacts" --out "$RUNNER_TEMP/snapshot-prepared.json" --json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const prepared = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/snapshot-prepared.json`, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `directory=${prepared.directory}\n`);
          NODE
      - name: Upload only the portable manifest and tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
