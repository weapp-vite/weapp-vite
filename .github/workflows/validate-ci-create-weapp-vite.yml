name: Validate Create Weapp Vite Smoke
on:
  workflow_call:
    inputs:
      verification_topology:
        required: false
        type: string
        default: optimized-v1
      pr_context:
        required: true
        type: string
      package-spec:
        type: string
        required: false
        default: latest
      source:
        type: string
        required: false
        default: published
      full-matrix:
        type: boolean
        required: false
        default: false
      os:
        type: string
        required: false
        default: ubuntu-latest
      node-version:
        type: string
        required: false
        default: '24'
      templates:
        type: string
        required: false
        default: default,wevu,tailwindcss
      scenarios:
        type: string
        required: false
        default: pnpm
      registries:
        type: string
        required: false
        default: npmjs,npmmirror
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-context:
    if: inputs.verification_topology != 'optimized-v2'
    uses: ./.github/workflows/reusable-frozen-pr-context.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      profile: ci-create-weapp-vite

  source-network-regression:
    if: ${{ !cancelled() && (inputs.verification_topology == 'optimized-v2' || needs.pr-context.result == 'success') && ((inputs.verification_topology == 'optimized-v2' && ((fromJSON(inputs.pr_context).event == 'pull_request' && fromJSON(inputs.pr_context).selections['ci-create-weapp-vite'] || fromJSON(inputs.pr_context).event != 'pull_request' && fromJSON(inputs.pr_context).shouldRun) && 'true' || 'false') || needs.pr-context.outputs.should_run) == 'true') }}
    needs: pr-context
    name: Scaffold Network Regression (${{ matrix.os }} / Node 22)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/reusable-node-command.yml
    with:
      verification_topology: ${{ inputs.verification_topology }}
      pr_context: ${{ inputs.pr_context }}
      pr_profile: ci-create-weapp-vite
      checkout_ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
      base_sha: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).baseSha || needs.pr-context.outputs.base_sha) }}
      head_sha: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headSha || needs.pr-context.outputs.head_sha) }}
      pr_number: ${{ (inputs.verification_topology == 'optimized-v2' && format('{0}', fromJSON(inputs.pr_context).prNumber || '') || needs.pr-context.outputs.pr_number) }}
      head_ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).headRef || needs.pr-context.outputs.head_ref) }}
      base_ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).baseRef || needs.pr-context.outputs.base_ref) }}
      runs_on: ${{ matrix.os }}
      node_version: '22'
      timeout_minutes: 45
      build_command: ${{ matrix.os == 'windows-latest' && 'pnpm build:pkgs:ci:windows' || matrix.os == 'macos-latest' && 'pnpm build:pkgs:ci:macos' || 'pnpm build:pkgs:ci' }}
      main_command: |
        pnpm --filter create-weapp-vite typecheck
        pnpm --filter create-weapp-vite test:types
        pnpm --filter create-weapp-vite test
    secrets: inherit

  prepare:
    needs: pr-context
    if: ${{ !cancelled() && (inputs.verification_topology == 'optimized-v2' || needs.pr-context.result == 'success') && ((inputs.verification_topology == 'optimized-v2' && ((fromJSON(inputs.pr_context).event == 'pull_request' && fromJSON(inputs.pr_context).selections['ci-create-weapp-vite'] || fromJSON(inputs.pr_context).event != 'pull_request' && fromJSON(inputs.pr_context).shouldRun) && 'true' || 'false') || needs.pr-context.outputs.should_run) == 'true' && ((inputs.verification_topology == 'optimized-v2' && (fromJSON(inputs.pr_context).isPr && 'true' || 'false') || needs.pr-context.outputs.is_pr) != 'true')) }}
    name: Prepare Smoke Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      package_spec: ${{ steps.inputs.outputs.package_spec }}
      source: ${{ steps.inputs.outputs.source }}
      templates: ${{ steps.inputs.outputs.templates }}
      scenarios: ${{ steps.inputs.outputs.scenarios }}
      registries: ${{ steps.inputs.outputs.registries }}

    env:
      WEAPP_VITE_VERIFICATION_TOPOLOGY: ${{ inputs.verification_topology }}
    steps:
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ^24.22.1
          check-latest: true

      - name: Resolve workflow inputs
        id: inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE_SPEC: ${{ github.event.inputs['package-spec'] || '' }}
          INPUT_SOURCE: ${{ inputs.source || 'published' }}
          INPUT_TEMPLATES: ${{ github.event.inputs.templates || '' }}
          INPUT_SCENARIOS: ${{ github.event.inputs.scenarios || '' }}
          INPUT_REGISTRIES: ${{ github.event.inputs.registries || '' }}
        run: |
          package_spec="${INPUT_PACKAGE_SPEC:-latest}"
          case "${INPUT_SOURCE}" in
            published|workspace) ;;
            *) echo 'Unsupported scaffold smoke source' >&2; exit 1 ;;
          esac
          templates="${INPUT_TEMPLATES:-default,wevu,tailwindcss}"
          scenarios="${INPUT_SCENARIOS:-pnpm}"
          registries="${INPUT_REGISTRIES:-npmjs,npmmirror}"
          {
            echo "package_spec=${package_spec}"
            echo "source=${INPUT_SOURCE}"
            echo "templates=${templates}"
            echo "scenarios=${scenarios}"
            echo "registries=${registries}"
          } >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FULL_MATRIX: ${{ github.event.inputs['full-matrix'] || 'false' }}
          INPUT_OS: ${{ github.event.inputs.os || 'ubuntu-latest' }}
          INPUT_NODE_VERSION: ${{ github.event.inputs['node-version'] || '24' }}
        run: |
          full_matrix='{"include":[
            {"os":"ubuntu-latest","node-version":"22","scope":"core"},
            {"os":"windows-latest","node-version":"22","scope":"core"},
            {"os":"macos-latest","node-version":"22","scope":"core"},
            {"os":"ubuntu-latest","node-version":"24","scope":"core"},
            {"os":"windows-latest","node-version":"24","scope":"core"},
            {"os":"macos-latest","node-version":"24","scope":"core"},
            {"os":"ubuntu-latest","node-version":"24","scope":"all-templates","templates":"default,multi-platform,multi-platform-sfc,plugin,lib,wevu,react,wevu-tdesign,tailwindcss,tdesign,vant"}
          ]}'

          single_matrix="$(printf '{"include":[{"os":"%s","node-version":"%s","scope":"core"}]}' "${INPUT_OS}" "${INPUT_NODE_VERSION}")"

          if [[ "${EVENT_NAME}" == "schedule" || "${INPUT_FULL_MATRIX}" == "true" ]]; then
            matrix="${full_matrix}"
          else
            matrix="${single_matrix}"
          fi

          {
            echo 'matrix<<__CREATE_WEAPP_VITE_MATRIX__'
            echo "${matrix}"
            echo '__CREATE_WEAPP_VITE_MATRIX__'
          } >> "$GITHUB_OUTPUT"

          {
            echo "### smoke matrix"
            echo "- event: \`${EVENT_NAME}\`"
            echo "- full matrix: \`${INPUT_FULL_MATRIX}\`"
            echo "- selected matrix:"
            echo '```json'
            echo "${matrix}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    if: ${{ !cancelled() && (inputs.verification_topology == 'optimized-v2' || needs.pr-context.result == 'success') && needs.prepare.result == 'success' && ((inputs.verification_topology == 'optimized-v2' && ((fromJSON(inputs.pr_context).event == 'pull_request' && fromJSON(inputs.pr_context).selections['ci-create-weapp-vite'] || fromJSON(inputs.pr_context).event != 'pull_request' && fromJSON(inputs.pr_context).shouldRun) && 'true' || 'false') || needs.pr-context.outputs.should_run) == 'true') }}
    needs: [pr-context, prepare]
    name: Create Smoke (${{ needs.prepare.outputs.source }} / ${{ matrix.os }} / Node ${{ matrix.node-version }} / ${{ matrix.scope }})
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      WEAPP_VITE_VERIFICATION_TOPOLOGY: ${{ inputs.verification_topology }}
    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --system core.longpaths true

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
          persist-credentials: false

      - name: Validate frozen identity in the executing job
        if: inputs.verification_topology == 'optimized-v2'
        uses: ./.github/actions/verify-frozen-job-context
        with:
          context: ${{ inputs.pr_context }}
          profile: ci-create-weapp-vite
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version == '22' && '^22.23.4' || matrix.node-version == '24' && '^24.22.1' || matrix.node-version == '26' && '^26.12.1' || matrix.node-version }}
          check-latest: ${{ matrix.node-version == '22' || matrix.node-version == '24' || matrix.node-version == '26' }}

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install workspace dependencies
        if: needs.prepare.outputs.source == 'workspace'
        run: pnpm install --frozen-lockfile

      - name: Build workspace scaffold
        if: needs.prepare.outputs.source == 'workspace'
        run: pnpm exec turbo run build --filter=create-weapp-vite...

      - name: Pack frozen workspace scaffold
        id: workspace
        if: needs.prepare.outputs.source == 'workspace'
        env:
          CREATE_WEAPP_VITE_SOURCE_COMMIT: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
        run: node scripts/createWeappViteSmoke/workspace.mjs

      - name: Print package manager versions
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          print_version() {
            local name="$1"
            shift
            echo "==> ${name}"
            if "$@"; then
              return 0
            fi
            echo "${name} unavailable"
            return 0
          }

          print_version node node -v
          print_version npm npm -v
          print_version pnpm pnpm -v
          print_version "smoke pnpm" corepack pnpm@12 -v
          print_version yarn yarn -v

      - name: Run create-weapp-vite smoke matrix
        env:
          CREATE_WEAPP_VITE_SPEC: ${{ needs.prepare.outputs.package_spec }}
          CREATE_WEAPP_VITE_SOURCE: ${{ needs.prepare.outputs.source }}
          CREATE_WEAPP_VITE_SOURCE_COMMIT: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
          CREATE_WEAPP_VITE_TARBALL: ${{ steps.workspace.outputs.tarball }}
          CREATE_WEAPP_VITE_TARBALL_SHA256: ${{ steps.workspace.outputs.tarball_sha256 }}
          CREATE_WEAPP_VITE_TEMPLATES: ${{ matrix.templates || needs.prepare.outputs.templates }}
          CREATE_WEAPP_VITE_SCENARIOS: ${{ needs.prepare.outputs.scenarios }}
          CREATE_WEAPP_VITE_REGISTRIES: ${{ needs.prepare.outputs.registries }}
          CREATE_WEAPP_VITE_REPORT_FILE: ${{ runner.temp }}/create-weapp-vite-smoke-report/report.json
          CREATE_WEAPP_VITE_REPORT_OS: ${{ matrix.os }}
          CREATE_WEAPP_VITE_REPORT_NODE: ${{ matrix.node-version }}
        run: node ./scripts/create-weapp-vite-smoke.mjs

      - name: Upload smoke report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: create-weapp-vite-smoke-report-${{ needs.prepare.outputs.source }}-${{ matrix.os }}-node${{ matrix.node-version }}-${{ matrix.scope }}
          path: ${{ runner.temp }}/create-weapp-vite-smoke-report/report.json
          if-no-files-found: warn

  report:
    name: Smoke Report
    if: (inputs.verification_topology == 'optimized-v2' && ((fromJSON(inputs.pr_context).event == 'pull_request' && fromJSON(inputs.pr_context).selections['ci-create-weapp-vite'] || fromJSON(inputs.pr_context).event != 'pull_request' && fromJSON(inputs.pr_context).shouldRun) && 'true' || 'false') || needs.pr-context.outputs.should_run) == 'true' && (!cancelled() && (inputs.verification_topology == 'optimized-v2' && (fromJSON(inputs.pr_context).isPr && 'true' || 'false') || needs.pr-context.outputs.is_pr) != 'true')
    needs: [pr-context, prepare, smoke]
    runs-on: ubuntu-latest

    env:
      WEAPP_VITE_VERIFICATION_TOPOLOGY: ${{ inputs.verification_topology }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (inputs.verification_topology == 'optimized-v2' && fromJSON(inputs.pr_context).checkoutSha || needs.pr-context.outputs.checkout_sha) }}
          persist-credentials: false

      - name: Validate frozen identity in the executing job
        if: inputs.verification_topology == 'optimized-v2'
        uses: ./.github/actions/verify-frozen-job-context
        with:
          context: ${{ inputs.pr_context }}
          profile: ci-create-weapp-vite
      - name: Download smoke report artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: create-weapp-vite-smoke-report-${{ needs.prepare.outputs.source }}-*
          path: artifacts/create-weapp-vite-smoke-report
          merge-multiple: false

      - name: Merge smoke reports
        run: node ./scripts/merge-create-weapp-vite-smoke-reports.mjs artifacts/create-weapp-vite-smoke-report artifacts/create-weapp-vite-smoke-report-summary

      - name: Append report to workflow summary
        run: cat artifacts/create-weapp-vite-smoke-report-summary/create-weapp-vite-smoke-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged smoke report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: create-weapp-vite-smoke-report-summary-${{ needs.prepare.outputs.source }}
          path: artifacts/create-weapp-vite-smoke-report-summary
