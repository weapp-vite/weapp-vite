name: Refresh Workspace Dependencies
description: Build workspace artifacts consumed through injected package links, then refresh installs.

inputs:
  build-command:
    description: Command used to build workspace artifacts before reinstalling
    required: true

runs:
  using: composite
  steps:
    - name: Build workspace artifacts
      shell: bash
      run: |-
        node .github/scripts/ci-timing.mjs start build
        trap 'phase_exit=$?; node .github/scripts/ci-timing.mjs finish build "$phase_exit"; exit "$phase_exit"' EXIT
        ${{ inputs.build-command }}
    - name: Refresh injected workspace dependencies
      shell: bash
      run: |-
        node .github/scripts/ci-timing.mjs start refresh-links
        trap 'phase_exit=$?; node .github/scripts/ci-timing.mjs finish refresh-links "$phase_exit"; exit "$phase_exit"' EXIT
        pnpm install --frozen-lockfile --ignore-scripts
