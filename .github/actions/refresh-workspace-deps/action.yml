name: Refresh Workspace Dependencies
description: Build workspace artifacts consumed through injected package links, then refresh installs.

inputs:
  build-command:
    description: Command used to build workspace artifacts before reinstalling
    required: true
  working-directory:
    description: Independent checkout whose artifacts and injected links are refreshed
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Build workspace artifacts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CI_TIMING_SCRIPT: ${{ github.action_path }}/../../scripts/ci-timing.mjs
      run: |-
        node "$CI_TIMING_SCRIPT" start build
        trap 'phase_exit=$?; node "$CI_TIMING_SCRIPT" finish build "$phase_exit"; exit "$phase_exit"' EXIT
        ${{ inputs.build-command }}
    - name: Refresh injected workspace dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CI_TIMING_SCRIPT: ${{ github.action_path }}/../../scripts/ci-timing.mjs
      run: |-
        node "$CI_TIMING_SCRIPT" start refresh-links
        trap 'phase_exit=$?; node "$CI_TIMING_SCRIPT" finish refresh-links "$phase_exit"; exit "$phase_exit"' EXIT
        pnpm install --frozen-lockfile --ignore-scripts
