name: Setup Node and pnpm
description: Enable pnpm, setup Node.js cache, and install dependencies after checkout.

inputs:
  node-version:
    description: Exact version, floating supported major, or default for the exact .node-version
    required: false
    default: default
  package-json-file:
    description: Manifest used by pnpm/action-setup, relative to the workspace
    required: false
    default: package.json
  cache:
    description: Package manager cache; empty disables caching
    required: false
    default: pnpm
  cache-dependency-path:
    description: Lockfile paths relative to the workspace
    required: false
    default: pnpm-lock.yaml
  registry-url:
    description: Optional registry authentication configuration
    required: false
    default: ''
  freeze-toolchain:
    description: Record the actual release and artifact toolchain identity
    required: false
    default: 'true'
  install-dependencies:
    description: Install now; artifact consumers can install once after restoring their dist
    required: false
    default: 'true'

outputs:
  node-version:
    description: Actual full Node.js version installed for this job
    value: ${{ steps.toolchain.outputs.node-version }}

runs:
  using: composite
  steps:
    - name: Enable Git long paths on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: git config --system core.longpaths true
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: ${{ inputs.package-json-file }}
    - name: Resolve Node selector
      id: selector
      shell: bash
      env:
        CI_NODE_VERSION: ${{ inputs.node-version }}
      run: node "$GITHUB_ACTION_PATH/../setup-node/selector.mjs"
    - name: Setup Node.js environment
      id: setup
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.selector.outputs.node-version }}
        check-latest: ${{ steps.selector.outputs.check-latest == 'true' }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        registry-url: ${{ inputs.registry-url }}
    - name: Record actual Node version
      id: toolchain
      shell: bash
      run: node -e "process.stdout.write('node-version=' + process.versions.node + '\n')" >> "$GITHUB_OUTPUT"
    - name: Freeze actual toolchain identity
      if: inputs.freeze-toolchain == 'true'
      shell: bash
      run: |
        node -e "process.stdout.write('REPOCTL_RELEASE_NODE_VERSION=' + process.version + '\nREPOCTL_RELEASE_PLATFORM=' + process.platform + '\nREPOCTL_RELEASE_ARCH=' + process.arch + '\n')" >> "$GITHUB_ENV"
        task_pnpm_version="$(pnpm --version)"
        printf 'REPOCTL_RELEASE_PNPM_VERSION=pnpm@%s\nBUILD_ARTIFACT_PACKAGE_MANAGER=pnpm@%s\n' "$task_pnpm_version" "$task_pnpm_version" >> "$GITHUB_ENV"
    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: |-
        node .github/scripts/ci-timing.mjs start install
        trap 'phase_exit=$?; node .github/scripts/ci-timing.mjs finish install "$phase_exit"; exit "$phase_exit"' EXIT
        pnpm install --frozen-lockfile
