[package]
name = "weapp-vite-ast-native"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = [ "cdylib" ]

[features]
default = []
experimental-chunk-analysis = [ "dep:oxc_semantic" ]
experimental-binding-analysis = [
  "dep:oxc_semantic",
  "oxc_syntax/to_js_string"
]

[dependencies]
napi = { version = "3.14.0", default-features = false, features = [ "napi4" ] }
napi-derive = "3.6.10"
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_ast_visit = "0.152.0"
oxc_parser = "0.152.0"
oxc_semantic = { version = "0.152.0", optional = true }
oxc_span = "0.152.0"
oxc_syntax = "0.152.0"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"

[build-dependencies]
napi-build = "2.6.0"
