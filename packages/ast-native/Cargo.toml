[package]
name = "weapp-vite-ast-native"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = [ "cdylib" ]

[dependencies]
napi = { version = "3.16.1", default-features = false, features = [ "napi4" ] }
napi-derive = "3.7.0"
oxc_allocator = "0.156.0"
oxc_ast = "0.156.0"
oxc_ast_visit = "0.156.0"
oxc_parser = "0.156.0"
oxc_semantic = "0.156.0"
oxc_span = "0.156.0"
oxc_syntax = "0.156.0"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2.6.0"
